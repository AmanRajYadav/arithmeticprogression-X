/* ── Ex 5.1 Q4 · "write three more terms" ──────────────────── */
function gNext(lvl){
  let a,d,style='auto';
  if(lvl===1){ a=F(nz(1,14)); d=F(nz(2,8)); }
  else if(lvl===2){ a=F(nz(-14,14)); d=F(nz(-9,9)); }
  else{
    if(rng()<0.5){ const dn=pick([2,3]); a=F(nz(-4,8)); d=F(nz(1,5),dn); style='frac'; }
    else{ a=F(rnd(-30,30),10); d=F(nz(-25,25),10); style='dec'; }
  }
  const shown=4, want=3;
  const right=[5,6,7].map(i=>fmt(term(a,d,i),style)).join(', ');
  const list=[
    {lb:right, ok:true},
    {lb:[5,6,7].map(i=>fmt(term(a,Fneg(d),i),style)).join(', '), ok:false,
     why:VD+' ka sign ulta laga diya. Wahi '+VD+' aage bhi add karna hai.'},
    {lb:[fmt(term(a,d,5),style),fmt(term(a,d,5),style),fmt(term(a,d,5),style)].join(', '), ok:false,
     why:'Ek hi baar '+VD+' add kiya. Har term me add karna hai.'},
    {lb:[6,7,8].map(i=>fmt(term(a,d,i),style)).join(', '), ok:false,
     why:'Ek term aage se shuru kar diya. Paanchve term se chalu karo.'},
    {lb:[3,2,1].map(i=>fmt(term(a,d,i),style)).join(', '), ok:false,
     why:'Ye peeche ke terms hain. Aage ke chahiye the.'}
  ];
  return {
    topic:'next', kicker:'Agle terms',
    lead:'Ye AP hai. Agle teen terms kya honge?',
    seq:seqStr(a,d,shown,style),
    mode:'mcq', opts:opts4(list), ansLabel:right, seqOpts:true,
    work:[
      {t:VD+' = a&#8322; &minus; a&#8321; = '+fmt(term(a,d,2),style)+' &minus; '+fmt(a,style)+' = '+fmt(d,style),
       why:'Pehle gap find karo.'},
      {t:'a&#8325; = '+fmt(term(a,d,shown),style)+' + '+fmt(d,style)+' = '+fmt(term(a,d,5),style), why:'Aakhri dikhe hue term me '+VD+' add karo.'},
      {t:'a&#8326; = '+fmt(term(a,d,5),style)+' + '+fmt(d,style)+' = '+fmt(term(a,d,6),style), why:''},
      {t:'a&#8327; = '+fmt(term(a,d,6),style)+' + '+fmt(d,style)+' = '+fmt(term(a,d,7),style), why:'Bas '+VD+' add karte jao.'}
    ],
    say:'NCERT me ye "write three more terms" wala hissa hai. AP pehchana, phir '+VD+' add karte jao.'
  };
}

/* ── Ex 5.2 Q1 · fill in the table ─────────────────────────── */
function gTable(lvl){
  let a,d,n,style='auto';
  if(lvl===1){ a=F(nz(2,15)); d=F(nz(2,8)); n=rnd(6,14); }
  else if(lvl===2){
    if(rng()<0.22){ a=F(nz(-20,20)); d=Fz; n=rnd(20,105); }   /* d = 0 is in the book */
    else{ a=F(nz(-20,20)); d=F(nz(-9,9)); n=rnd(8,20); }
  }else{
    if(rng()<0.5){ a=F(rnd(-250,250),10); d=F(nz(-40,40),10); n=rnd(6,14); style='dec'; }
    else{ a=F(nz(-18,18)); d=F(nz(-11,11)); n=rnd(15,40); }
  }
  const an=term(a,d,n);
  /* with d = 0 every n gives the same term, so n can never be the hole —
     and there is no d to recover either. NCERT's own d = 0 row asks for aₙ. */
  const kinds = Fis0(d) ? ['an','an','a'] : ['an','a','n','d'];
  const hide=pick(kinds);
  const show=k=>k===hide?'?':(
    k==='a'?fmt(a,style) : k==='d'?fmt(d,style) : k==='n'?String(n) : fmt(an,style));
  const strip=VA+' = '+show('a')+' &nbsp;·&nbsp; '+VD+' = '+show('d')+
              ' &nbsp;·&nbsp; '+VN+' = '+show('n')+' &nbsp;·&nbsp; a<sub>n</sub> = '+show('an');

  let ans, wrong, lead;
  if(hide==='an'){
    ans=an; lead='Table me a<sub>n</sub> missing hai. Wo kya hoga?';
    wrong=[
      {v:term(a,d,n+1), why:'Ye '+VA+' + '+VN+VD+' hai. '+VN+'th term me gaps '+(n-1)+' hote hain.'},
      {v:term(a,d,n-1), why:'Ek gap kam le liya.'},
      {v:Fscale(d,n), why:VA+' add karna bhool gaye.'},
      {v:Fadd(a,d), why:'Ye doosra term hai.'},
      {v:Fsub(a,Fscale(d,n-1)), why:VD+' subtract kar diya, add karna tha.'}
    ];
  }else if(hide==='a'){
    ans=Fsub(an,Fscale(d,n-1)); lead=VA+' missing hai. Pehla term kya hoga?';
    wrong=[
      {v:Fsub(an,Fscale(d,n)), why:'Ek gap zyada subtract kar diya.'},
      {v:Fsub(an,Fscale(d,n-2)), why:'Ek gap kam subtract kiya.'},
      {v:Fadd(an,Fscale(d,n-1)), why:'Peeche jaana tha — add nahi, subtract karo.'},
      {v:an, why:'Ye toh a<sub>n</sub> hi hai.'},
      {v:Fsub(an,d), why:'Sirf ek gap peeche gaye. '+(n-1)+' gaps peeche jaana tha.'}
    ];
  }else if(hide==='d'){
    ans=Fdiv(Fsub(an,a),F(n-1)); lead=VD+' missing hai. Common difference kya hoga?';
    wrong=[
      {v:Fdiv(Fsub(an,a),F(n)), why:VN+' se divide kar diya. Gaps '+(n-1)+' hote hain.'},
      {v:Fsub(an,a), why:'Divide karna bhool gaye — ye poora fasla hai, ek gap nahi.'},
      {v:Fdiv(Fsub(a,an),F(n-1)), why:'Sign ulta. a<sub>n</sub> me se '+VA+' subtract karo.'},
      {v:Fdiv(Fsub(an,a),F(n+1)), why:'Ek gap zyada gin liya.'}
    ];
  }else{
    ans=F(n); lead=VN+' missing hai. Kitne terms hain?';
    wrong=[
      {v:F(n-1), why:'Ye gaps ki ginti hai. Terms ek zyada hote hain — plus one karo.'},
      {v:F(n+1), why:'Ek term zyada gin liya.'},
      {v:F(n+2), why:'Do term zyada gin liye.'},
      {v:F(n-2), why:'Do term kam gin liye.'}
    ].filter(w=>w.v.n>0);
  }
  const aStyle = hide==='n' ? 'auto' : style;
  const canT = lvl>=2 && canType(ans,aStyle);
  return {
    topic:'table', kicker:'Table bharo',
    lead:lead,
    seq:strip, seqSmall:true,
    mode:canT?'type':'mcq',
    opts:canT?null:opts4([{lb:fmt(ans,aStyle),ok:true}].concat(
      shuffle(wrong.filter(w=>!Feq(w.v,ans))).map(w=>({lb:fmt(w.v,aStyle),ok:false,why:w.why})))),
    ansLabel:fmt(ans,aStyle), ansTyped:typedForm(ans,aStyle),
    work:[
      {t:'a<sub>n</sub> = '+FORMULA, why:'Table ke charon column isi ek formula se jude hain.'},
      {t:fmt(an,style)+' = '+fmt(a,style)+' + ('+String(n)+' &minus; 1)('+fmt(d,style)+')',
       why:'Jo teen pata hain wo rakh do, chautha apne aap nikal aayega.'},
      {t:(hide==='an'?'a<sub>n</sub>':hide==='a'?VA:hide==='d'?VD:VN)+' = '+fmt(ans,aStyle), why:''}
    ],
    say:'Charon me se koi teen pata ho toh chautha nikal hi aayega. Ye NCERT ka pehla question hai.'
  };
}

/* ── Ex 5.2 Q3 · missing terms in the boxes ────────────────── */
function gMissing(lvl){
  const k=rnd(3,6);
  let p=1, q=k;
  if(rng()<0.45){ p=2; q=k; }
  else if(rng()<0.3){ p=1; q=k-1; }
  if(q-p<2){ p=1; q=k; }
  let a,d,style='auto';
  if(lvl===1){ a=F(nz(1,12)); d=F(nz(2,7)); }
  else if(lvl===2){ a=F(nz(-14,14)); d=F(nz(-8,8)); }
  else{ const dn=pick([2,2,4]); a=F(nz(-6,10)); d=F(nz(-9,9),dn); style='frac'; }

  const hidden=[];
  for(let i=1;i<=k;i++)if(i!==p&&i!==q)hidden.push(i);
  const ask=pick(hidden);
  const cells=[];
  for(let i=1;i<=k;i++){
    if(i===p||i===q)cells.push(fmt(term(a,d,i),style));
    else cells.push('<span class="blank'+(i===ask?' ask':'')+'">'+(i===ask?'?':'&#9633;')+'</span>');
  }
  const ans=term(a,d,ask);
  const wrong=[
    {v:term(a,d,ask+1), why:'Ek box aage nikal gaye.'},
    {v:term(a,d,ask-1), why:'Ek box peeche reh gaye.'},
    {v:Fdiv(Fadd(term(a,d,p),term(a,d,q)),F(2)), why:'Dono dikhne wale terms ka average le liya. Wo tabhi chalega jab box bilkul beech me ho.'},
    {v:Fadd(term(a,d,p),d), why:'Pehle dikhne wale term me sirf ek '+VD+' add kiya.'},
    {v:Fsub(term(a,d,ask),Fscale(d,2)), why:'Do gap peeche reh gaye.'}
  ];
  const canT = lvl<=2 && canType(ans,style);
  const gaps=q-p;
  return {
    topic:'missing', kicker:'Missing terms',
    lead:'Is AP me <b>?</b> wale box me kya aayega?',
    seq:cells.join(', '),
    mode:canT?'type':'mcq',
    opts:canT?null:opts4([{lb:fmt(ans,style),ok:true}].concat(
      shuffle(wrong.filter(w=>!Feq(w.v,ans))).map(w=>({lb:fmt(w.v,style),ok:false,why:w.why})))),
    ansLabel:fmt(ans,style), ansTyped:typedForm(ans,style),
    work:[
      {t:'Do term pata hain: a<sub>'+p+'</sub> = '+fmt(term(a,d,p),style)+' aur a<sub>'+q+'</sub> = '+fmt(term(a,d,q),style),
       why:'Do term pata ho toh poora AP pata hai.'},
      {t:'Unke beech '+gaps+' gap hain &rarr; '+gaps+VD+' = '+fmt(term(a,d,q),style)+' &minus; '+fmt(term(a,d,p),style)+' = '+fmt(Fscale(d,gaps),style),
       why:'a<sub>'+q+'</sub> &minus; a<sub>'+p+'</sub> me '+gaps+' gaps hote hain, '+q+' nahi.'},
      {t:VD+' = '+fmt(d,style), why:''},
      {t:'a<sub>'+ask+'</sub> = a<sub>'+p+'</sub> '+(ask>p?'+':'&minus;')+' '+Math.abs(ask-p)+VD+
         ' = '+fmt(term(a,d,p),style)+' '+(ask>p?'+':'&minus;')+' '+Math.abs(ask-p)+'('+fmt(d,style)+') = '+fmt(ans,style),
       why:ask>p?('Ab box tak '+VD+' add karte jao.')
                :('Box peeche hai, isliye '+VD+' subtract karte jao.')}
    ],
    say:'Do box bhi pata ho toh poora AP khul jaata hai. Bas gaps theek se gino.'
  };
}

/* ── Ex 5.2 Q7, Q8, Q9, Q16 + Example 5 · two terms given ──── */
function gTwoTerms(lvl){
  const kind = lvl===1 ? 'term' : pick(['term','term','zero','ap','dee']);
  let a=nz(-14,16), d=nz(2,7);
  if(rng()<0.4)d=-d;
  let p=pick([3,4,5,11]), q=p+pick([2,4,5,6]);
  if(kind==='zero'){
    /* choose a and d so that some term really is zero */
    d=nz(2,6)*(rng()<0.5?1:-1);
    const z=rnd(5,20);
    a=-d*(z-1);
    p=pick([2,3,4]); q=p+pick([3,5,6]);
  }
  const ap=a+(p-1)*d, aq=a+(q-1)*d;
  const given=ord(p)+' term '+fmt(F(ap))+' hai aur '+ord(q)+' term '+fmt(F(aq))+' hai.';

  if(kind==='dee'){
    const list=[
      {lb:fmt(F(d)), ok:true},
      {lb:fmt(F(-d)), ok:false, why:'Sign ulta. Baad wale term me se pehle wala subtract karo.'},
      {lb:fmt(F((aq-ap)/(q-p)*2)), ok:false, why:'Gaps aadhe gin liye.'},
      {lb:fmt(F(aq-ap)), ok:false, why:'Divide karna bhool gaye. Ye '+(q-p)+' gaps ek saath hain.'},
      {lb:fmt(F(a)), ok:false, why:'Ye pehla term hai, '+VD+' nahi.'},
      {lb:fmt(F(ap)), ok:false, why:'Ye '+ord(p)+' term hai, gap nahi.'},
      {lb:String(q-p), ok:false, why:'Ye gaps ki ginti hai, '+VD+' nahi.'}
    ];
    return {
      topic:'twoterm', kicker:'Do term diye hain',
      lead:'Ek AP ka '+given+' Common difference kya hai?',
      mode:'mcq', opts:opts4(list), ansLabel:fmt(F(d)),
      work:[
        {t:'a<sub>'+p+'</sub> = '+VA+' + '+(p-1)+VD+' = '+fmt(F(ap))+'&nbsp; &nbsp;(i)', why:''},
        {t:'a<sub>'+q+'</sub> = '+VA+' + '+(q-1)+VD+' = '+fmt(F(aq))+'&nbsp; &nbsp;(ii)', why:''},
        {t:'(ii) &minus; (i): '+(q-p)+VD+' = '+fmt(F(aq-ap))+' &rarr; '+VD+' = '+fmt(F(d)),
         why:VA+' apne aap cancel ho jaata hai — isliye do term milte hi '+VD+' mil jaata hai.'}
      ],
      say:'Do term diye hain toh subtract kar do — '+VA+' cancel, '+VD+' haath me.'
    };
  }

  if(kind==='zero'){
    const zpos=Math.round((0-a)/d)+1;
    const list=[
      {lb:String(zpos), ok:true},
      {lb:String(zpos-1), ok:false, why:'Plus one karna bhool gaye. '+VN+' &minus; 1 = '+(zpos-1)+' aaya tha.'},
      {lb:String(zpos+1), ok:false, why:'Ek term aage nikal gaye.'},
      {lb:'0', ok:false, why:'0 term ki value hai, position nahi. Position poochhi gayi hai.'},
      {lb:String(zpos+2), ok:false, why:'Do term aage nikal gaye.'},
      {lb:String(p), ok:false, why:'Ye toh wahi position hai jo question me di gayi thi.'},
      {lb:String(zpos-2), ok:false, why:'Do term peeche reh gaye.'}
    ].filter(o=>o.ok||o.lb!==String(zpos));
    return {
      topic:'twoterm', kicker:'Kaunsa term zero',
      lead:'Ek AP ka '+given+' Is AP ka kaunsa term zero hai?',
      mode:'mcq', opts:opts4(list), ansLabel:zpos+'th term',
      work:[
        {t:'(ii) &minus; (i): '+(q-p)+VD+' = '+fmt(F(aq-ap))+' &rarr; '+VD+' = '+fmt(F(d)), why:VA+' cancel ho gaya.'},
        {t:VD+' ko (i) me daalo &rarr; '+VA+' = '+fmt(F(a)), why:''},
        {t:'a<sub>n</sub> = 0 &rarr; '+fmt(F(a))+' + ('+VN+' &minus; 1)('+fmt(F(d))+') = 0', why:'"Kaunsa term zero hai" matlab a<sub>n</sub> = 0 rakh do.'},
        {t:VN+' &minus; 1 = '+(zpos-1)+' &rarr; '+VN+' = '+zpos, why:'Answer "'+zpos+'th term" likhna — sirf '+zpos+' nahi.'}
      ],
      say:'Position poochhi hai toh answer me "th term" lagana. Wo value nahi hai.'
    };
  }

  if(kind==='ap'){
    const right=[a,a+d,a+2*d].map(x=>fmt(F(x))).join(', ');
    const list=[
      {lb:right, ok:true},
      {lb:[a,a-d,a-2*d].map(x=>fmt(F(x))).join(', '), ok:false, why:VD+' ka sign ulta lag gaya.'},
      {lb:[a+d,a+2*d,a+3*d].map(x=>fmt(F(x))).join(', '), ok:false, why:'Pehla term chhod diya — ye doosre se shuru ho raha hai.'},
      {lb:[d,a,a+d].map(x=>fmt(F(x))).join(', '), ok:false, why:VA+' aur '+VD+' aapas me badal gaye.'},
      {lb:[a,a+2*d,a+4*d].map(x=>fmt(F(x))).join(', '), ok:false, why:'Har baar do gap chhod diye.'},
      {lb:[ap,ap+d,ap+2*d].map(x=>fmt(F(x))).join(', '), ok:false,
       why:'Ye '+ord(p)+' term se shuru ho raha hai. Pehle teen terms chahiye the.'},
      {lb:[a,a+d,a+2*d].map(x=>fmt(F(x))).reverse().join(', '), ok:false, why:'Ulta likh diya.'}
    ];
    return {
      topic:'twoterm', kicker:'Poora AP find karo',
      lead:'Ek AP ka '+given+' Pehle teen terms kya honge?',
      mode:'mcq', opts:opts4(list), ansLabel:right, seqOpts:true,
      work:[
        {t:VA+' + '+(p-1)+VD+' = '+fmt(F(ap))+'&nbsp; &nbsp;(i)', why:''},
        {t:VA+' + '+(q-1)+VD+' = '+fmt(F(aq))+'&nbsp; &nbsp;(ii)', why:''},
        {t:'(ii) &minus; (i): '+(q-p)+VD+' = '+fmt(F(aq-ap))+' &rarr; '+VD+' = '+fmt(F(d)), why:'Yahi linear equations wala elimination hai.'},
        {t:'(i) me daalo &rarr; '+VA+' = '+fmt(F(a)), why:''},
        {t:'Hence the AP is '+right+', &hellip;', why:VA+', '+VA+' + '+VD+', '+VA+' + 2'+VD}
      ],
      say:'Do baatein di hain toh do equations. Aage ka kaam linear equations wala hi hai.'
    };
  }

  /* find some other term */
  let r=pick([q+pick([4,7,10,15]), 29, 31]);
  if(r===p||r===q)r=q+5;
  const ans=F(a+(r-1)*d);
  const wrong=[
    {v:F(a+r*d), why:ord(r)+' term me gaps '+(r-1)+' hote hain, '+r+' nahi.'},
    {v:F(a+(r-2)*d), why:'Ek gap kam le liya.'},
    {v:F(ap+aq), why:'Dono diye hue terms add kar diye — formula lagana tha.'},
    {v:F(a), why:'Ye pehla term hai.'},
    {v:F(r*d), why:VA+' add karna bhool gaye.'},
    {v:F(a+(r+1)*d), why:'Do gap zyada le liye.'},
    {v:F(aq), why:'Ye '+ord(q)+' term hai, '+ord(r)+' nahi.'}
  ];
  const canT = lvl>=2;
  return {
    topic:'twoterm', kicker:'Do term diye hain',
    lead:'Ek AP ka '+given+' Iska '+ord(r)+' term kya hoga?',
    mode:canT?'type':'mcq',
    opts:canT?null:opts4([{lb:fmt(ans),ok:true}].concat(
      shuffle(wrong.filter(w=>!Feq(w.v,ans))).map(w=>({lb:fmt(w.v),ok:false,why:w.why})))),
    ansLabel:fmt(ans), ansTyped:typedForm(ans),
    work:[
      {t:VA+' + '+(p-1)+VD+' = '+fmt(F(ap))+'&nbsp; &nbsp;(i)', why:'Pehli baat ko equation banao.'},
      {t:VA+' + '+(q-1)+VD+' = '+fmt(F(aq))+'&nbsp; &nbsp;(ii)', why:'Doosri baat se doosri equation.'},
      {t:'(ii) &minus; (i): '+(q-p)+VD+' = '+fmt(F(aq-ap))+' &rarr; '+VD+' = '+fmt(F(d)), why:VA+' cancel ho gaya.'},
      {t:'(i) me daalo &rarr; '+VA+' = '+fmt(F(a)), why:''},
      {t:'a<sub>'+r+'</sub> = '+fmt(F(a))+' + '+(r-1)+'('+fmt(F(d))+') = '+fmt(ans), why:'Ab wahi purana formula.'}
    ],
    say:VA+' aur '+VD+' mil gaye toh AP ka koi bhi term nikal sakta hai.'
  };
}

/* ── Ex 5.2 Q10, Q11 · "exceeds by" ────────────────────────── */
function gExceeds(lvl){
  const kind=pick(['findd','findn']);
  if(kind==='findd'){
    const q=pick([8,10,12,14]), p=q+pick([5,7,6,4]);
    const d=nz(1,7);
    const by=(p-q)*d;
    const list=[
      {lb:fmt(F(d)), ok:true},
      {lb:fmt(F(by)), ok:false, why:'Ye poora fasla hai. Usme '+(p-q)+' gaps hain — divide karna hai.'},
      {lb:fmt(F(-d)), ok:false, why:'Sign ulta. Bada term chhote se '+by+' zyada hai, toh '+VD+' positive hai.'},
      {lb:fmt(F(d*2)), ok:false, why:'Gaps aadhe gin liye.'},
      {lb:String(p-q), ok:false, why:'Ye gaps ki ginti hai, '+VD+' nahi.'}
    ].filter(o=>o&&o.lb);
    return {
      topic:'exceeds', kicker:'Exceeds by',
      lead:'Ek AP ka '+ord(p)+' term apne '+ord(q)+' term se '+by+' zyada hai. Common difference kya hai?',
      mode:'mcq', opts:opts4(list), ansLabel:fmt(F(d)),
      work:[
        {t:'a<sub>'+p+'</sub> &minus; a<sub>'+q+'</sub> = '+by, why:'"Exceeds by" matlab minus karke '+by+' aata hai.'},
        {t:'('+VA+' + '+(p-1)+VD+') &minus; ('+VA+' + '+(q-1)+VD+') = '+by, why:'Dono ko formula me likho.'},
        {t:VA+' cancel &rarr; '+(p-q)+VD+' = '+by, why:'Sirf gaps ka fark bacha.'},
        {t:VD+' = '+by+' &divide; '+(p-q)+' = '+fmt(F(d)), why:''}
      ],
      say:'"Exceeds by" dikhe toh subtract karo. '+VA+' hamesha cancel ho jaata hai.'
    };
  }
  const a=nz(1,9), d=pick([3,4,6,12,5]);
  const base=pick([54,40,30,25]);
  const steps=rnd(4,14);
  const more=steps*d;
  const n=base+steps;
  const wrong=[
    {v:steps, why:'Ye kitne term aage jaana hai, wo hai. Us par '+base+' add karna baaki hai.'},
    {v:n-1, why:'Ek term peeche reh gaye.'},
    {v:n+1, why:'Ek term aage nikal gaye.'},
    {v:more, why:'Ye value ka fark hai, position nahi.'},
    {v:base, why:'Ye toh wahi term hai jisse compare kar rahe hain.'}
  ];
  return {
    topic:'exceeds', kicker:'Kaunsa term',
    lead:'AP: '+seqStr(F(a),F(d),4,'auto')+' — iska kaunsa term apne '+ord(base)+' term se '+more+' zyada hoga?',
    mode:lvl>=2?'type':'mcq',
    opts:lvl>=2?null:opts4([{lb:String(n),ok:true}].concat(
      shuffle(wrong.filter(w=>w.v!==n&&w.v>0)).map(w=>({lb:String(w.v),ok:false,why:w.why})))),
    ansLabel:String(n), ansTyped:String(n),
    work:[
      {t:'a<sub>n</sub> &minus; a<sub>'+base+'</sub> = '+more, why:'"'+more+' more than" matlab yahi.'},
      {t:'('+VN+' &minus; '+base+')'+VD+' = '+more, why:VA+' cancel ho gaya, sirf gaps ka fark bacha.'},
      {t:VN+' &minus; '+base+' = '+more+' &divide; '+d+' = '+steps, why:VD+' = '+d+' hai.'},
      {t:VN+' = '+base+' + '+steps+' = '+n, why:'Position wapas add karna mat bhoolna.'}
    ],
    say:'Do terms ka fark hamesha gaps ka fark hota hai. '+VA+' ka koi role hi nahi.'
  };
}

/* ── Ex 5.2 Q13, Q14 + Example 7 · counting ────────────────── */
function gCountAP(lvl){
  const kind=pick(['digits','between']);
  if(kind==='digits'){
    const digits=pick([2,3]);
    const k=pick(digits===2?[3,4,6,7]:[4,6,7,8,9]);
    const lo=digits===2?10:100, hi=digits===2?99:999;
    const first=Math.ceil(lo/k)*k, last=Math.floor(hi/k)*k;
    const n=(last-first)/k+1;
    const name=digits===2?'two-digit':'three-digit';
    const wrong=[
      {v:n-1, why:'Plus one karna bhool gaye. Gaps '+(n-1)+' hain, numbers '+n+'.'},
      {v:n+1, why:'Ek number zyada gin liya.'},
      {v:Math.floor(hi/k), why:'1 se '+hi+' tak ke saare multiples gin liye. Sirf '+name+' chahiye the.'},
      {v:last, why:'Ye aakhri number hai, ginti nahi.'}
    ];
    return {
      topic:'countap', kicker:'Kitne numbers',
      lead:'Kitne '+name+' numbers '+k+' se divisible hain?',
      mode:lvl>=2?'type':'mcq',
      opts:lvl>=2?null:opts4([{lb:String(n),ok:true}].concat(
        shuffle(wrong.filter(w=>w.v!==n&&w.v>0)).map(w=>({lb:String(w.v),ok:false,why:w.why})))),
      ansLabel:String(n), ansTyped:String(n),
      work:[
        {t:'Pehla '+name+' number jo '+k+' se divisible hai: '+first, why:name+' matlab '+lo+' se '+hi+' tak.'},
        {t:'Aakhri: '+last, why:''},
        {t:'AP: '+first+', '+(first+k)+', '+(first+2*k)+', &hellip;, '+last+'&nbsp; &rarr; '+VA+' = '+first+', '+VD+' = '+k,
         why:'Multiples hamesha AP hote hain — gap wahi divisor hota hai.'},
        {t:last+' = '+first+' + ('+VN+' &minus; 1)'+k+' &rarr; '+VN+' = '+n, why:'Wahi last term ka formula.'}
      ],
      say:'Multiples ki list hamesha ek AP hai. Pehla aur aakhri find karo, phir '+VN+' nikal lo.'
    };
  }
  const k=pick([4,5,6,7,8,9]);
  const lo=pick([10,20,25,50]), hi=pick([200,250,300,400]);
  const first=Math.floor(lo/k)*k+k, last=Math.ceil(hi/k)*k-k;
  const n=(last-first)/k+1;
  const wrong=[
    {v:n-1, why:'Plus one karna bhool gaye.'},
    {v:n+1, why:'Ek multiple zyada gin liya — '+lo+' aur '+hi+' khud shaamil nahi hain.'},
    {v:Math.floor(hi/k), why:'1 se '+hi+' tak ke saare multiples gin liye.'},
    {v:n+2, why:'Dono end ke multiples bhi gin liye.'}
  ];
  return {
    topic:'countap', kicker:'Kitne multiples',
    lead:''+lo+' aur '+hi+' ke beech '+k+' ke kitne multiples hain?',
    mode:lvl>=2?'type':'mcq',
    opts:lvl>=2?null:opts4([{lb:String(n),ok:true}].concat(
      shuffle(wrong.filter(w=>w.v!==n&&w.v>0)).map(w=>({lb:String(w.v),ok:false,why:w.why})))),
    ansLabel:String(n), ansTyped:String(n),
    work:[
      {t:''+lo+' ke baad '+k+' ka pehla multiple: '+first, why:'"Beech me" matlab '+lo+' aur '+hi+' khud shaamil nahi.'},
      {t:''+hi+' se pehle aakhri multiple: '+last, why:''},
      {t:'AP: '+first+', '+(first+k)+', &hellip;, '+last+'&nbsp; &rarr; '+VA+' = '+first+', '+VD+' = '+k, why:''},
      {t:last+' = '+first+' + ('+VN+' &minus; 1)'+k+' &rarr; '+VN+' = '+n, why:''}
    ],
    say:'"Between" ka matlab dono ends chhod do. Yahin par ek marks jaata hai.'
  };
}

/* ── Ex 5.2 Q15 · two APs with an equal term ───────────────── */
function gEqualTerms(lvl){
  const d1=nz(2,8);
  let d2=nz(2,9); if(d2===d1)d2=d1+3;
  const n=rnd(6,25);
  /* a1 + (n−1)d1 = a2 + (n−1)d2  →  pick a2 freely, derive a1 */
  const a2=nz(1,12);
  const a1=a2+(n-1)*(d2-d1);
  const wrong=[
    {v:n-1, why:'Plus one karna bhool gaye. '+VN+' &minus; 1 = '+(n-1)+' aaya tha.'},
    {v:n+1, why:'Ek term aage nikal gaye.'},
    {v:a1+(n-1)*d1, why:'Ye term ki value hai, position nahi.'},
    {v:Math.abs(a1-a2), why:'Ye pehle terms ka fark hai, position nahi.'}
  ];
  const A1=fmt(F(a1)), A2=fmt(F(a2)), D1=fmt(F(d1)), D2=fmt(F(d2)), GAP=fmt(F(a1-a2));
  return {
    topic:'equalterm', kicker:'Do APs',
    lead:'Do APs hain: '+seqStr(F(a1),F(d1),3,'auto')+' aur '+seqStr(F(a2),F(d2),3,'auto')+
         ' — kis '+VN+' par dono ke '+VN+'th term equal honge?',
    seqSmall:true,
    mode:lvl>=2?'type':'mcq',
    opts:lvl>=2?null:opts4([{lb:String(n),ok:true}].concat(
      shuffle(wrong.filter(w=>w.v!==n&&w.v>0)).map(w=>({lb:fmt(F(w.v)),ok:false,why:w.why})))),
    ansLabel:String(n), ansTyped:String(n),
    work:[
      {t:'Pehla AP: '+VA+' = '+A1+', '+VD+' = '+D1+'&nbsp; &nbsp;Doosra AP: '+VA+' = '+A2+', '+VD+' = '+D2,
       why:'Dono ka '+VA+' aur '+VD+' alag alag likh lo.'},
      {t:A1+' + ('+VN+' &minus; 1)'+D1+' = '+A2+' + ('+VN+' &minus; 1)'+D2, why:'"Equal" matlab dono ko equal rakh do.'},
      {t:'('+VN+' &minus; 1)('+D2+' &minus; '+D1+') = '+A1+' &minus; '+A2+' = '+GAP, why:VN+' wale terms ek taraf, numbers doosri taraf.'},
      {t:VN+' &minus; 1 = '+(n-1)+' &rarr; '+VN+' = '+n, why:'Plus one — hamesha.'}
    ],

/* ── Ex 5.2 Q12 · two APs with the same common difference ──── */
function gTwoAPsDiff(lvl){
  const p=pick([50,99,100,75]), q=pick([500,999,1000,750]);
  const diff=pick([p, p+10, 60, 120]);
  const list=[
    {lb:String(diff), ok:true},
    {lb:String(diff*q/p|0), ok:false, why:'Position ke hisaab se badha diya. '+VD+' dono me same hai, isliye fark badalta hi nahi.'},
    {lb:String(q), ok:false, why:'Position ko answer bana diya.'},
    {lb:'0', ok:false, why:'Fark zero tabhi hota jab dono APs ek hi hote.'},
    {lb:String(diff*2), ok:false, why:'Double kar diya — lekin fark har position par wahi rehta hai.'}
  ];
  return {
    topic:'twoap', kicker:'Do APs, same d',
    lead:'Do APs ka common difference same hai. Unke '+ord(p)+' terms ka fark '+diff+' hai. '+ord(q)+' terms ka fark kya hoga?',
    mode:'mcq', opts:opts4(list), ansLabel:String(diff),
    work:[
      {t:'Pehle AP ka '+ord(p)+' term = '+VA+' + '+(p-1)+VD, why:''},
      {t:'Doosre AP ka '+ord(p)+' term = A + '+(p-1)+VD, why:VD+' dono ka same hai, isliye same '+VD+'.'},
      {t:'Fark = ('+VA+' + '+(p-1)+VD+') &minus; (A + '+(p-1)+VD+') = '+VA+' &minus; A = '+diff,
       why:(p-1)+VD+' cancel ho gaya.'},
      {t:''+ord(q)+' terms ka fark = ('+VA+' + '+(q-1)+VD+') &minus; (A + '+(q-1)+VD+') = '+VA+' &minus; A = '+diff,
       why:'Wahi cancel. Isliye fark har position par same rehta hai.'}
    ],
    say:VD+' same hai toh fark kabhi badalta hi nahi. Question hard nahi, samajhne ki baat hai.'
  };
}

/* ════════════════════════════════════════════════════════════════
   POOLS — which generators live behind which door.

   The three doors follow the book:
     Part 01  Exercise 5.1            what an AP is, a and d
     Part 02  Exercise 5.2, pehla hissa   the formula itself
     Part 03  Exercise 5.2, exam sawaal   two terms, counting, word problems

   Sum of n terms (Exercise 5.3) is not here yet — it has not been
   taught. It sits on the menu as a coming-soon card instead.
   ════════════════════════════════════════════════════════════════ */

const POOLS={
  pattern:[gIsAP,gIsAP,gIsAP,gFindD,gFindD,gFindAD,gBuild,gBuild,gNext,gSituation,gSituation],
  formula:[gNth,gNth,gNth,gFindN,gFindN,gTable,gTable,gMissing,gMissing,gFromEnd,gMid,gMid,gSymb],
  word:[gTwoTerms,gTwoTerms,gTranslate,gApply,gApply,gExceeds,gCountAP,gCountAP,gEqualTerms,gTwoAPsDiff,gTwoEq]
};

const LESSON_TOPIC_GEN={
  isap:gIsAP, findd:gFindD, findad:gFindAD, build:gBuild, next:gNext,
  nth:gNth, findn:gFindN, fromend:gFromEnd, mid:gMid, symb:gSymb,
  table:gTable, missing:gMissing,
  situation:gSituation, translate:gTranslate, apply:gApply, twoeq:gTwoEq,
  twoterm:gTwoTerms, exceeds:gExceeds, countap:gCountAP,
  equalterm:gEqualTerms, twoap:gTwoAPsDiff
};

/* generator keys whose reported topic differs from the key itself */
const CHECK_TOPIC={ findad:'findd' };
function topicOfCheck(k){ return CHECK_TOPIC[k]||k; }

const TOPIC_PART={
  isap:'pattern', findd:'pattern', build:'pattern', next:'pattern', situation:'pattern',
  nth:'formula', findn:'formula', fromend:'formula', mid:'formula', symb:'formula',
  table:'formula', missing:'formula',
  translate:'word', apply:'word', twoeq:'word', twoterm:'word',
  exceeds:'word', countap:'word', equalterm:'word', twoap:'word'
};

function genQuestion(part,lvl){
  if(part==='mixed'||part==='weekly'){
    const all=POOLS.pattern.concat(POOLS.formula, POOLS.word);
    return pick(all)(lvl);
  }
  let g=pick(POOLS[part]||POOLS.pattern);
  if(part==='word'&&lvl<3&&g===gTwoEq)g=gApply;      /* the 3-mark question stays on hard */
  return g(lvl);
}
function genForTopic(topic,lvl){
  const g=LESSON_TOPIC_GEN[topic]||gIsAP;
  return g(lvl);
}
/* a run of fresh questions, no two identical prompts back to back */
function buildRun(part,lvl,count){
  const out=[], seen=new Set();
  let guard=0;
  while(out.length<count && guard++<count*30){
    const q=genQuestion(part,lvl);
    const sig=(q.lead||'')+'|'+(q.seq||'')+'|'+(q.ansLabel||'');
    if(seen.has(sig))continue;
    seen.add(sig); out.push(q);
  }
  while(out.length<count)out.push(genQuestion(part,lvl));
  return out;
}

/* ── menu chrome ──────────────────────────────────────────── */
function paintMenu(){
  const p=Store.p();
  const who=Store.d.who||'Student';
  $('profName').textContent=who;
  $('profDot').textContent=who.slice(0,1).toUpperCase();
  $('streakN').textContent=Store.liveStreak();
  const bank=(p&&p.bank)?p.bank.length:0;
  const rev=$('revN');
  rev.hidden=bank===0; rev.textContent=bank;
  ['pattern','formula','word'].forEach(part=>{
    const key={pattern:'Pat',formula:'Form',word:'Word'}[part];
    const L=$('pill'+key+'L'), P=$('pill'+key+'P');
    const total=LESSONS[part].length;
    const done=LESSONS[part].filter(l=>p&&p.lessons&&p.lessons[l.id]).length;
    L.textContent='Seekho '+done+'/'+total;
    L.className='pill'+(done===total?' done':'');
    const best=p&&p.best&&p.best[part];
    P.textContent=best?('Best '+best.pts+' · '+best.acc+'%'):'Practice';
    P.className='pill'+(best?' acc':'');
  });
  const wk=isoWeekKey(new Date());
  const w=p&&p.weekly&&p.weekly[wk];
  $('weeklyMeta').textContent=w?('Tumhara best: '+w.best+' · attempt '+w.attempts):'';
  $('soonFormula').innerHTML=NEXT_UP.body;
  $('soonNote').textContent=NEXT_UP.note;
}

/* ── lesson ───────────────────────────────────────────────── */
let LS=null;
function openLesson(part,id){
  const L=LESSONS[part].find(x=>x.id===id);
  if(!L)return;
  LS={part:part, L:L, i:0};
  curPart=part;
  $('lessonNext').onclick=null;                 /* never leave a stale handler behind */
  paintLesson();
  show('lesson');
}
function paintLesson(){
  const {L,i}=LS;
  $('lessonRail').innerHTML=L.cards.map((_,k)=>'<i class="'+(k<=i?'on':'')+'"></i>').join('');
  $('lessonCard').innerHTML=L.cards[i];
  $('lessonPrev').disabled=i===0;
  $('lessonPrev').style.opacity=i===0?.4:1;
  $('lessonNext').textContent=(i===L.cards.length-1)?'3 sawaal karo':'Aage';
  $('lessonNext').onclick=()=>{
    Snd.tap();
    if(LS.i<L.cards.length-1){ LS.i++; paintLesson(); }
    else startCheck(LS.part,L);
  };
}
$('lessonPrev').addEventListener('click',()=>{ if(LS&&LS.i>0){ LS.i--; paintLesson(); Snd.tap(); } });
$('lessonBack').addEventListener('click',()=>{ openHub(LS?LS.part:curPart); });

/* ── round setup ──────────────────────────────────────────── */
function startCheck(part,L){
  const list=L.checks.map(t=>genForTopic(t, L.lvl||1));
  G={ mode:'check', part:part, lvl:L.lvl||1, lesson:L, list:list, i:0,
      pts:0, combo:0, best:0, right:0, wrong:0, missed:[], t0:Date.now(),
      timed:false, revenge:false, tries:0 };
  paintQ();
  show('play');
}
function startRun(part,lvl,opts){
  opts=opts||{};
  const n=CFG.runLen[part]||10;
  const list=opts.list||buildRun(part,lvl,n);
  G={ mode:opts.mode||part, part:part, lvl:lvl, list:list, i:0,
      pts:0, combo:0, best:0, right:0, wrong:0, missed:[], t0:Date.now(),
      timed:opts.timed!==undefined?opts.timed:Opt.timer,
      revenge:false, tries:0, weekKey:opts.weekKey||null };
  Snd.wake();
  paintQ();
  show('play');
  tick();
}
let timerH=null;
function tick(){
  clearInterval(timerH);
  const el=$('hudTime');
  el.hidden=!G||!G.timed;
  if(!G||!G.timed)return;
  const paint=()=>{
    if(!G)return;
    const s=Math.floor((Date.now()-G.t0)/1000);
    el.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  };
  paint();
  timerH=setInterval(paint,1000);
}

/* ── question rendering ───────────────────────────────────── */
function paintQ(){
  const q=G.list[G.i];
  G.tries=0;
  $('hudQ').textContent=(G.revenge?'⚔ ':'')+(G.i+1)+'/'+G.list.length;
  $('hudPts').textContent=G.pts;
  $('hudCombo').hidden=G.combo<2;
  $('hudCombo').textContent='×'+(G.combo+1);
  $('hudBar').style.width=Math.round(G.i/G.list.length*100)+'%';

  let h='<div class="qkicker">'+esc(q.kicker||'')+'</div>';
  if(q.lead)h+='<p class="qtext lead">'+q.lead+'</p>';
  if(q.seq){
    const cls='qseq'+((q.seq.length>34||q.seqSmall)?' long':'');
    h+='<div class="'+cls+'">'+q.seq+'</div>';
  }
  if(q.big)h+='<div class="qbig'+(q.big.length>15?' long':'')+'">'+q.big+'</div>';
  $('playBody').innerHTML=h;

  const foot=$('playFoot');
  if(q.mode==='type'){
    foot.innerHTML=
      '<div style="display:flex;gap:8px;align-items:stretch">'+
        '<div class="typed empty" id="typedBox" style="flex:1">Answer</div>'+
        '<button class="iconbtn" id="padBack" aria-label="Backspace" style="height:auto;width:52px">'+
          '<svg viewBox="0 0 24 24"><path d="M20 5H9L3 12l6 7h11a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1zM17 9l-6 6M11 9l6 6"/></svg>'+
        '</button>'+
      '</div>'+
      '<div class="pad" id="pad">'+
        [1,2,3,4,5,6,7,8,9].map(n=>'<button data-k="'+n+'">'+n+'</button>').join('')+
        '<button data-k="-" class="sm">&plusmn;</button>'+
        '<button data-k="0">0</button>'+
        '<button data-k="." class="sm">.</button>'+
      '</div>'+
      '<button class="btn btn-primary w100" id="checkBtn" style="margin-top:10px">Check</button>';
    G.typed='';
    foot.querySelectorAll('#pad button').forEach(b=>{
      b.addEventListener('pointerdown',e=>{ e.preventDefault(); padKey(b.dataset.k); });
    });
    $('padBack').addEventListener('pointerdown',e=>{ e.preventDefault(); padKey('back'); });
    $('checkBtn').addEventListener('click',()=>submitTyped());
  }else{
    foot.innerHTML='<div class="opts">'+q.opts.map((o,k)=>
      '<button class="opt'+(q.seqOpts?' seqopt':'')+'" data-i="'+k+'">'+
      '<span class="k">'+'ABCD'[k]+'</span><span class="lb">'+o.lb+'</span></button>').join('')+'</div>';
    foot.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>answerMCQ(+b.dataset.i)));
  }
}
function padKey(k){
  if(!G||G.locked)return;
  Snd.key();
  if(k==='back')G.typed=G.typed.slice(0,-1);
  else if(k==='-')G.typed=G.typed.startsWith('-')?G.typed.slice(1):'-'+G.typed;
  else if(k==='.'){ if(!G.typed.includes('.'))G.typed+= G.typed===''||G.typed==='-'?'0.':'.'; }
  else if(G.typed.replace(/[-.]/g,'').length<7)G.typed+=k;
  const box=$('typedBox');
  if(!box)return;
  box.classList.toggle('empty',G.typed==='');
  box.textContent=G.typed===''?'Answer':G.typed.replace(/-/g,MINUS);
}
document.addEventListener('keydown',e=>{
  if(curScreen!=='play'||!G||G.locked)return;
  const q=G.list[G.i];
  if(q.mode==='type'){
    if(/^[0-9]$/.test(e.key))padKey(e.key);
    else if(e.key==='.')padKey('.');
    else if(e.key==='-')padKey('-');
    else if(e.key==='Backspace')padKey('back');
    else if(e.key==='Enter')submitTyped();
  }else if(/^[1-4]$/.test(e.key))answerMCQ(+e.key-1);
  else if(/^[a-dA-D]$/.test(e.key))answerMCQ('abcd'.indexOf(e.key.toLowerCase()));
});

/* ── answering ────────────────────────────────────────────── */
function sameNumber(a,b){
  const x=parseFloat(a), y=parseFloat(b);
  if(isNaN(x)||isNaN(y))return false;
  return Math.abs(x-y)<1e-9;
}
function submitTyped(){
  if(!G||G.locked)return;
  if(G.typed===''||G.typed==='-'){ toast('Answer likho phir Check dabao'); return; }
  const q=G.list[G.i];
  const ok=sameNumber(G.typed,q.ansTyped)||G.typed===q.ansTyped;
  const box=$('typedBox');
  box.classList.add(ok?'good':'bad');
  land(ok,null);
}
function answerMCQ(i){
  if(!G||G.locked||i<0)return;
  const q=G.list[G.i];
  if(!q.opts||!q.opts[i])return;
  const chosen=q.opts[i];
  const btns=$('playFoot').querySelectorAll('.opt');
  btns.forEach(b=>b.disabled=true);
  btns[i].classList.add(chosen.ok?'good':'bad');
  if(!chosen.ok){
    const ci=q.opts.findIndex(o=>o.ok);
    if(ci>=0)btns[ci].classList.add('good');
  }
  land(chosen.ok,chosen);
}

function land(ok,chosen){
  G.locked=true;
  const q=G.list[G.i];
  Store.scoreTopic(q.topic,ok);
  if(ok){
    G.right++;
    if(G.revenge)G.revRight=(G.revRight||0)+1;
    G.combo++;
    G.best=Math.max(G.best,G.combo);
    const speed=G.timed?Math.max(0,5-Math.floor((Date.now()-(G.qT0||G.t0))/4000)):3;
    const gain=G.revenge?150:(10+Math.min(10,G.combo*2)+speed)*(G.mode==='check'?1:G.lvl);
    G.pts+=gain;
    Snd.right(G.combo);
    Store.bankClear(q.topic);
    const pts=$('hudPts'); pts.textContent=G.pts; pts.classList.remove('pop'); void pts.offsetWidth; pts.classList.add('pop');
    setTimeout(next,900);
  }else{
    G.wrong++; G.combo=0;
    Snd.wrong();
    $('playBody').classList.remove('shake'); void $('playBody').offsetWidth; $('playBody').classList.add('shake');
    if(!G.revenge){ G.missed.push(q); Store.bankAdd(q); }
    showWork(q,chosen);
  }
  Store.save();
}
function next(){
  G.locked=false;
  G.i++;
  G.qT0=Date.now();
  if(G.i>=G.list.length)finishStage();
  else paintQ();
}
function finishStage(){
  if(!G.revenge && G.missed.length && G.mode!=='weekly' && G.mode!=='check'){
    const list=G.missed.map(q=>{
      if(q.opts)q.opts=shuffle(q.opts);
      return q;
    });
    G.mainRight=G.right; G.mainTotal=G.right+G.wrong;
    G.revRight=0; G.revTotal=list.length;
    G.revenge=true; G.list=list; G.i=0; G.missed=[];
    openSheet(
      '<h4>Badla round</h4>'+
      '<p class="diag">'+list.length+' sawaal jo chhoot gaye the, wapas aa rahe hain. Is baar +150 per sawaal, aur galat hone par kuch nahi katega.</p>'+
      '<button class="btn btn-primary w100" data-close>Chalo</button>',
      {onClose:()=>{ paintQ(); }});
    return;
  }
  endRun();
}

/* ── the teaching moment ──────────────────────────────────── */
function showWork(q,chosen){
  const lines=(q.work||[]).map((w,i)=>
    '<div class="ln" style="animation-delay:'+(i*60)+'ms">'+w.t+
    (w.why?'<span class="why">'+w.why+'</span>':'')+'</div>').join('');
  const diag = chosen&&chosen.why ? chosen.why
             : (q.mode==='type' ? 'Sahi answer: <strong>'+q.ansLabel+'</strong>' : '');
  const html=
    '<div class="verdict no"><span class="mark"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></span>'+
    '<h3>Ye silly mistake nahi hai</h3></div>'+
    (diag?'<p class="diag">'+diag+'</p>':'')+
    (q.mode==='type'&&chosen===null?'<p class="diag">Sahi answer: <strong>'+q.ansLabel+'</strong></p>':'')+
    '<div class="work">'+lines+'</div>'+
    (q.say?'<p class="diag" style="color:var(--honey-text);font-weight:600">'+q.say+'</p>':'')+
    '<button class="btn btn-primary w100" data-close style="margin-top:6px">Samajh gaya</button>';
  openSheet(html,{locked:false,onClose:next});
}

/* ── end of round ─────────────────────────────────────────── */
function endRun(){
  clearInterval(timerH);
  const secs=Math.round((Date.now()-G.t0)/1000);
  const total=G.mainTotal!==undefined?G.mainTotal:(G.right+G.wrong);
  const rightMain=G.mainRight!==undefined?G.mainRight:G.right;
  const acc=total?Math.round(rightMain/total*100):0;
  G.rightMain=rightMain;
  const p=Store.p();

  if(G.mode==='check'){
    if(p){ p.lessons=p.lessons||{}; p.lessons[G.lesson.id]=true; Store.save(); }
    Snd.done();
    const part=G.part;
    openSheet(
      '<div class="verdict ok"><span class="mark"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></span>'+
      '<h3>Lesson complete</h3></div>'+
      '<p class="diag">'+G.right+'/'+total+' sahi. Ab isi topic ki practice karo — jo seekha hai wo tabhi tikta hai.</p>'+
      '<button class="btn btn-primary w100" data-close>Theek hai</button>',
      {onClose:()=>{ G=null; openHub(part); }});
    return;
  }

  Store.bumpStreak();
  if(p){
    p.runs=(p.runs||0)+1;
    p.pts=(p.pts||0)+G.pts;
    const key=G.mode;
    const b=p.best[key];
    if(!b||G.pts>b.pts)p.best[key]={pts:G.pts,acc:acc,time:secs};
    p.log=p.log||[];
    p.log.unshift({m:key,lvl:G.lvl,pts:G.pts,acc:acc,t:secs,d:Store.today(),timed:!!G.timed});
    if(p.log.length>40)p.log.length=40;
    if(G.weekKey){
      p.weekly=p.weekly||{};
      const w=p.weekly[G.weekKey]||{first:G.pts,best:0,attempts:0};
      w.attempts++; w.best=Math.max(w.best,G.pts);
      p.weekly[G.weekKey]=w;
    }
    Store.save();
  }
  Snd.done();
  paintReport(acc,secs,total);
  show('report');
}

const MODE_NAME={pattern:'Pattern',formula:'a + (n−1)d',word:'Word problems',mixed:'Mixed test',weekly:'Hafte ka paper',revenge:'Badla mode'};
function paintReport(acc,secs,total){
  const p=Store.p();
  const who=Store.d.who||'Student';
  const mm=Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0');
  const lvlName=['','Easy','Medium','Hard'][G.lvl]||'';
  const topics=Object.keys(p&&p.topics?p.topics:{}).map(k=>{
    const t=p.topics[k], n=t.r+t.w;
    return {k:k, n:n, pct:n?Math.round(t.r/n*100):0};
  }).filter(t=>t.n>=2).sort((a,b)=>a.pct-b.pct);
  const weak=topics[0];

  let h='<div class="topbar"><button class="iconbtn" id="repBack" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button><span class="spacer"></span></div>';
  h+='<div class="scorecard glass"><span class="eyebrow">'+esc(MODE_NAME[G.mode]||'')+(lvlName?' · '+lvlName:'')+'</span>'+
     '<div class="n" id="bigScore">0</div>'+
     '<p class="tiny" style="color:var(--ink-2)">'+esc(who)+' · '+G.rightMain+'/'+total+' sahi'+
       (G.revTotal?' · badla '+(G.revRight||0)+'/'+G.revTotal:'')+(G.timed?'':' · bina timer')+'</p>'+
     '<div class="statrow">'+
       '<div class="stat"><b>'+acc+'%</b><span>Accuracy</span></div>'+
       '<div class="stat"><b>'+G.best+'</b><span>Combo</span></div>'+
       '<div class="stat"><b>'+mm+'</b><span>Time</span></div>'+
     '</div></div>';

  if(topics.length){
    h+='<div class="panel glass"><span class="eyebrow">Kahan kaam baaki hai</span><div style="margin-top:8px">';
    topics.slice(0,5).forEach(t=>{
      h+='<div class="topicrow"><span class="nm">'+esc(TOPICS[t.k]||t.k)+'</span>'+
         '<span class="bar"><i class="'+(t.pct<70?'weak':'')+'" style="width:'+t.pct+'%"></i></span>'+
         '<span class="tiny" style="width:34px;text-align:right;color:var(--ink-3)">'+t.pct+'%</span></div>';
    });
    h+='</div>';
    if(weak&&weak.pct<80){
      const part=TOPIC_PART[weak.k]||'pattern';
      h+='<button class="btn btn-ghost w100" id="goWeak" style="margin-top:12px">'+
         esc(TOPICS[weak.k])+' phir se seekho</button>';
      h+='<input type="hidden" id="weakPart" value="'+part+'">';
    }
    h+='</div>';
  }

  if(acc>=90&&!Opt.timer&&G.mode!=='weekly'){
    h+='<div class="panel glass"><span class="eyebrow">Ab speed</span>'+
       '<p class="tiny" style="color:var(--ink-2);margin-top:6px">Accuracy '+acc+'% hai — ab timer on karke khelo. Pehle sahi, phir tez.</p>'+
       '<button class="btn btn-ghost w100" id="turnTimer" style="margin-top:10px">Timer on karo</button></div>';
  }

  lastShare=buildShare(acc,mm,total);
  h+='<button class="btn btn-wa w100" id="shareBtn" style="margin-bottom:9px">'+CFG.teacher+' ko score bhejo</button>';
  h+='<div style="display:flex;gap:9px;width:100%">'+
     '<button class="btn btn-ghost" id="againBtn" style="flex:1">Phir se</button>'+
     '<button class="btn btn-primary" id="menuBtn" style="flex:1">Menu</button></div>';

  $('reportBody').innerHTML=h;
  countTo($('bigScore'),G.pts,760);
  const mode=G.mode, lvl=G.lvl, part=G.part, wk=G.weekKey;
  $('repBack').onclick=()=>{ G=null; paintMenu(); show('menu'); };
  $('menuBtn').onclick=()=>{ G=null; paintMenu(); show('menu'); };
  $('againBtn').onclick=()=>{
    G=null;
    if(mode==='weekly')startWeekly();
    else if(mode==='mixed')startRun('mixed',lvl,{mode:'mixed'});
    else if(mode==='revenge')startRevenge();
    else startRun(part,lvl);
  };
  $('shareBtn').onclick=()=>{
    window.open('https://wa.me/?text='+encodeURIComponent(lastShare),'_blank');
  };
  const gw=$('goWeak');
  if(gw)gw.onclick=()=>{
    const pt=$('weakPart').value;
    G=null;
    const covers=l=>l.checks.map(topicOfCheck).concat(l.also||[]).indexOf(weak.k)>=0;
    const L=LESSONS[pt].find(covers)||LESSONS[pt][0];
    openHub(pt);                       /* build the list first, so Back has somewhere to land */
    openLesson(pt,L.id);
  };
  const tt=$('turnTimer');
  if(tt)tt.onclick=()=>{ Opt.setTimer(true); toast('Timer on. Ab har round timed hoga.'); tt.disabled=true; tt.textContent='Timer on hai'; };
}
function buildShare(acc,mm,total){
  const p=Store.p();
  const who=Store.d.who||'Student';
  const lvlName=['','Easy','Medium','Hard'][G.lvl]||'';
  const L=[];
  L.push('📐 SIDHI — Arithmetic Progression');
  L.push(who+' · '+(MODE_NAME[G.mode]||G.mode)+(lvlName?' ('+lvlName+')':''));
  L.push('Score: '+G.pts+' points');
  L.push('Sahi: '+G.rightMain+'/'+total+' — '+acc+'%');
  if(G.revTotal)L.push('Badla round: '+(G.revRight||0)+'/'+G.revTotal);
  L.push('Time: '+mm+(G.timed?'':' (bina timer)'));
  L.push('Best combo: '+G.best);
  const st=Store.liveStreak();
  if(st>1)L.push('Streak: '+st+' din 🔥');
  const topics=Object.keys(p&&p.topics?p.topics:{}).map(k=>{
    const t=p.topics[k], n=t.r+t.w;
    return {k:k,n:n,pct:n?Math.round(t.r/n*100):0};
  }).filter(t=>t.n>=2).sort((a,b)=>a.pct-b.pct);
  if(topics[0]&&topics[0].pct<80)L.push('Kamzor: '+TOPICS[topics[0].k]+' ('+topics[0].pct+'%)');
  if(G.weekKey&&p&&p.weekly&&p.weekly[G.weekKey])L.push('Weekly attempt #'+p.weekly[G.weekKey].attempts);
  L.push('');
  L.push('🏫 FLUENCE');
  return L.join('\n');
}

/* ── special modes ────────────────────────────────────────── */
function startWeekly(){
  const key=isoWeekKey(new Date());
  const seed=strHash(CFG.appId+'|'+key);
  const saved=Math.random;
  rng=mulberry32(seed);
  const list=buildRun('weekly',2,CFG.runLen.weekly);
  rng=saved;                                    /* normal play must never be seeded */
  startRun('weekly',2,{mode:'weekly',list:list,timed:true,weekKey:key});
}
function startRevenge(){
  const p=Store.p();
  const bank=(p&&p.bank)?p.bank.slice(-10):[];
  if(!bank.length){ toast('Abhi koi galti bank me nahi hai. Pehle practice karo.'); return; }
  const list=bank.map(b=>genForTopic(b.topic,2));
  /* about one in ten is a fresh question from a nearby topic, so it stays a test */
  const extra=Math.max(1,Math.round(list.length*0.1));
  for(let i=0;i<extra;i++){
    const t=pick(bank).topic;
    list.push(genQuestion(TOPIC_PART[t]||'pattern',2));
  }
  startRun('revenge',2,{mode:'revenge',list:shuffle(list)});
}

      '<button class="sw'+(Snd.haptics?' on':'')+'" id="swHap"><i></i></button></div>'+
    '<div class="switchrow"><span class="lbl"><b>Timer</b><span>Pehle accuracy, phir speed. Weekly paper hamesha timed hai.</span></span>'+
      '<button class="sw'+(Opt.timer?' on':'')+'" id="swTim"><i></i></button></div>'+
    '<button class="btn btn-primary w100" data-close style="margin-top:14px">Ho gaya</button>');
  const t=(id,get,set)=>{
    const el=$(id);
    el.addEventListener('click',()=>{ const v=!get(); set(v); el.classList.toggle('on',v); Snd.tap(); });
  };
  t('swSnd',()=>Snd.on,v=>Snd.set(v));
  t('swHap',()=>Snd.haptics,v=>Snd.setHap(v));
  t('swTim',()=>Opt.timer,v=>Opt.setTimer(v));
}
function sheetRecords(){
  const p=Store.p();
  let h='<h4>Records</h4>';
  if(!p||!p.log||!p.log.length){
    h+='<p class="diag">Abhi tak koi round poora nahi hua. Ek round khelo — yahan aa jayega.</p>';
  }else{
    h+='<div class="statrow" style="margin-top:4px">'+
       '<div class="stat"><b>'+(p.runs||0)+'</b><span>Rounds</span></div>'+
       '<div class="stat"><b>'+(p.pts||0)+'</b><span>Total points</span></div>'+
       '<div class="stat"><b>'+Store.liveStreak()+'</b><span>Streak</span></div></div>';
    h+='<p class="eyebrow" style="margin:14px 0 6px">Pichle rounds</p>';
    p.log.slice(0,12).forEach(r=>{
      h+='<div class="logrow"><b>'+r.pts+'</b><span style="flex:1">'+esc(MODE_NAME[r.m]||r.m)+
         (r.lvl?' · L'+r.lvl:'')+'</span><span style="color:var(--ink-3)">'+r.acc+'% · '+r.d+
         (r.timed?'':' · bina timer')+'</span></div>';
    });
    const topics=Object.keys(p.topics||{}).map(k=>{
      const t=p.topics[k], n=t.r+t.w;
      return {k:k,n:n,pct:n?Math.round(t.r/n*100):0};
    }).filter(t=>t.n>=2).sort((a,b)=>a.pct-b.pct);
    if(topics.length){
      h+='<p class="eyebrow" style="margin:16px 0 6px">Topic ke hisaab se</p>';
      topics.forEach(t=>{
        h+='<div class="topicrow"><span class="nm">'+esc(TOPICS[t.k]||t.k)+'</span>'+
           '<span class="bar"><i class="'+(t.pct<70?'weak':'')+'" style="width:'+t.pct+'%"></i></span>'+
           '<span class="tiny" style="width:34px;text-align:right;color:var(--ink-3)">'+t.pct+'%</span></div>';
      });
    }
  }
  h+='<button class="btn btn-primary w100" data-close style="margin-top:16px">Band karo</button>';
  openSheet(h);
}
function sheetProfile(){
  const names=Object.keys(Store.d.players||{});
  let h='<h4>Kaun khel raha hai?</h4>';
  names.forEach(n=>{
    h+='<button class="hubrow" data-who="'+esc(n)+'" style="--tint:rgba(47,75,255,.12)">'+
       '<span class="ic">'+esc(n.slice(0,1).toUpperCase())+'</span>'+
       '<span class="txt"><b>'+esc(n)+'</b><span>'+(Store.d.players[n].runs||0)+' rounds · '+(Store.d.players[n].pts||0)+' points</span></span>'+
       (n===Store.d.who?'<span class="tick"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></span>':'')+
       '</button>';
  });
  h+='<div style="display:flex;gap:8px;margin-top:12px">'+
     '<input class="namefield" id="newWho" placeholder="Naya naam" maxlength="14" style="flex:1">'+
     '<button class="btn btn-primary" id="addWho" style="flex:0 0 96px">Add</button></div>'+
     '<button class="btn btn-quiet w100" data-close style="margin-top:10px">Band karo</button>';
  const close=openSheet(h);
  document.querySelectorAll('[data-who]').forEach(b=>b.addEventListener('click',()=>{
    Store.d.who=b.dataset.who; Store.save(); paintMenu(); close();
  }));
  $('addWho').addEventListener('click',()=>{
    const v=$('newWho').value.trim();
    if(!v){ toast('Naam likho'); return; }
    if(!Store.d.players[v])Store.mk(v);
    else { Store.d.who=v; Store.save(); }
    paintMenu(); close();
  });
}

/* ── wiring ───────────────────────────────────────────────── */
$('startBtn').addEventListener('click',()=>{
  Snd.wake(); Snd.tap();
  const inp=$('nameIn');
  if(!Store.d.who){
    if(inp.hidden){ inp.hidden=false; inp.focus(); $('startBtn').textContent='Chalo'; return; }
    const v=inp.value.trim();
    if(!v){ toast('Apna naam likho — score isi naam se jayega'); inp.focus(); return; }
    Store.mk(v);
  }
  paintMenu(); show('menu');
});
$('nameIn').addEventListener('keydown',e=>{ if(e.key==='Enter')$('startBtn').click(); });
$('titleSettings').addEventListener('click',()=>{ Snd.wake(); sheetSettings(); });
$('setBtn').addEventListener('click',sheetSettings);
$('recBtn').addEventListener('click',sheetRecords);
$('profChip').addEventListener('click',sheetProfile);
$('doorPat').addEventListener('click',()=>{ Snd.tap(); openHub('pattern'); });
$('doorForm').addEventListener('click',()=>{ Snd.tap(); openHub('formula'); });
$('doorWord').addEventListener('click',()=>{ Snd.tap(); openHub('word'); });
$('doorMixed').addEventListener('click',()=>{ Snd.tap(); startRun('mixed',2,{mode:'mixed'}); });
$('doorRevenge').addEventListener('click',()=>{ Snd.tap(); startRevenge(); });
$('doorWeekly').addEventListener('click',()=>{ Snd.tap(); startWeekly(); });
document.querySelectorAll('[data-back="menu"]').forEach(b=>b.addEventListener('click',()=>{ paintMenu(); show('menu'); }));
$('playBack').addEventListener('click',()=>{
  if(!G){ show('menu'); return; }
  const part=G.part, isCheck=G.mode==='check';
  openSheet(
    '<h4>Round chhod dein?</h4>'+
    '<p class="diag">Is round ke points nahi gine jayenge. Koi baat nahi — wapas aa ke phir se kar lena.</p>'+
    '<div style="display:flex;gap:9px;margin-top:12px">'+
      '<button class="btn btn-ghost" id="quitYes" style="flex:1">Haan, chhodo</button>'+
      '<button class="btn btn-primary" data-close style="flex:1">Nahi, khelte hain</button></div>');
  $('quitYes').addEventListener('click',()=>{
    clearInterval(timerH); G=null; closeSheet();
    if(isCheck)openHub(part); else { paintMenu(); show('menu'); }
  });
});

/* ── boot ─────────────────────────────────────────────────── */
Store.boot(); Snd.boot(); Opt.boot();
if(Store.d.who){
  $('startBtn').textContent='Khelo, '+Store.d.who;
}
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('ap-sw.js').catch(()=>{}); });
}

/* test hook — the suite runs this script in a vm and needs the internals */
globalThis.__ap={
  F,Fadd,Fsub,Fmul,Fdiv,Fscale,Fneg,Feq,Fis0,Fnum,fmt,decStr,moneyStr,fracStr,typedForm,
  term,seqStr,nOf,MINUS,
  POOLS,TOPICS,TOPIC_PART,LESSONS,PARTS,CFG,
  genQuestion,genForTopic,buildRun,gIsAP,gFindD,gFindAD,gBuild,gNth,gFindN,gFromEnd,gMid,gSymb,
  gSituation,gTranslate,gApply,gTwoEq,
  mulberry32,strHash,isoWeekKey,
  setRng(f){ rng=f; }, getRng(){ return rng; },
  topicOfCheck, CHECK_TOPIC,
  round(){ return G; }
};
