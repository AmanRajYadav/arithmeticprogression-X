:root{
  --ink:#101A2C; --ink-2:#3D4A64; --ink-3:#6A7793;
  --paper:#EDF1FA; --paper-2:#DFE6F5;
  --current:#2F4BFF; --current-dk:#1428A8;
  --sa:#FF6A45; --sd:#00B39F;                 /* a = first term · d = common difference */
  --sa-text:#B84C32; --sd-text:#007C6E;
  --honey:#FFAE18; --ok:#0E9F5B; --no:#E14338;
  --honey-text:#94650E; --ok-text:#0B7E48; --no-text:#C63B31;

  --font-d:'Bricolage Grotesque','Trebuchet MS','Segoe UI',sans-serif;
  --font-b:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;
  --font-v:'Newsreader',Georgia,'Times New Roman',serif;

  --r-lg:30px; --r-md:20px; --r-sm:14px;
  --shadow-s:0 2px 6px -2px rgba(16,26,44,.16);
  --shadow-m:0 18px 34px -22px rgba(16,26,44,.42);
  --shadow-l:0 40px 70px -38px rgba(16,26,44,.55);
  --ease:cubic-bezier(.2,.9,.25,1);
  --spring:cubic-bezier(.34,1.56,.5,1);
  --blur:20px;
}
@media (max-width:680px){ :root{ --blur:10px } }

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font-b); color:var(--ink); background:var(--paper);
  min-height:100dvh; line-height:1.55; font-size:16px;
  -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none;
  user-select:none; overscroll-behavior-y:none; overflow-x:hidden;
}
input{user-select:text}
button,a,input{touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--current);outline-offset:3px;border-radius:8px}

/* ── ambient ─────────────────────────────────────────────── */
#bloom{
  position:fixed;inset:-20%;z-index:-2;pointer-events:none;
  background:
    radial-gradient(38vmax 38vmax at 12% 8%,  rgba(255,106,69,.20), transparent 62%),
    radial-gradient(42vmax 42vmax at 88% 14%, rgba(0,179,159,.20),  transparent 62%),
    radial-gradient(46vmax 46vmax at 76% 86%, rgba(47,75,255,.16),  transparent 64%),
    radial-gradient(34vmax 34vmax at 18% 92%, rgba(255,174,24,.16), transparent 60%);
  animation:drift 34s var(--ease) infinite alternate;
}
@keyframes drift{ to{ transform:translate3d(2.5%,-2%,0) scale(1.08) } }
@media (max-width:680px){ #bloom{animation:none} }
#grain{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.035;width:100%;height:100%}

/* ── app shell ───────────────────────────────────────────── */
.screen{
  display:none; flex-direction:column; align-items:center;
  width:100%; max-width:560px; margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 18px) 18px calc(26px + env(safe-area-inset-bottom));
}
.screen.on{display:flex;animation:rise .42s var(--ease) both}
#s-title.on{min-height:100dvh;justify-content:center}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.glass{
  background:linear-gradient(158deg,rgba(255,255,255,.80),rgba(255,255,255,.42));
  border:1px solid rgba(255,255,255,.75);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9), var(--shadow-m);
  backdrop-filter:blur(var(--blur)) saturate(150%);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(150%);
  border-radius:var(--r-lg);
}
@supports not (backdrop-filter:blur(1px)){ .glass{background:rgba(255,255,255,.9)} }

/* ── type ────────────────────────────────────────────────── */
.d{font-family:var(--font-d);font-weight:800}
.v{font-family:var(--font-v);font-style:italic;font-weight:500}
.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--ink-3)}
.tiny{font-size:12.5px;line-height:1.5}
.hero{
  font-family:var(--font-d);font-weight:800;
  font-size:clamp(46px,15vw,88px);line-height:.88;letter-spacing:-.045em;
  background:linear-gradient(120deg,var(--current-dk),var(--current) 55%,var(--sd));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  margin:2px 0 6px;
}
.hero-sub{font-size:15px;color:var(--ink-2);text-align:center;max-width:20em;margin-bottom:14px}

/* variables carry their meaning in colour, everywhere they appear */
.va{color:var(--sa-text);font-family:var(--font-v);font-style:italic;font-weight:600}
.vd{color:var(--sd-text);font-family:var(--font-v);font-style:italic;font-weight:600}
.vn{color:var(--current-dk);font-family:var(--font-v);font-style:italic;font-weight:600}

.brandmark{display:flex;align-items:center;gap:8px;margin-bottom:10px;opacity:.9}
.brandmark img{width:26px;height:26px;object-fit:contain}
.brandmark span{font-family:var(--font-d);font-weight:800;font-size:13px;letter-spacing:.22em}

/* ── buttons ─────────────────────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:52px;padding:0 20px;border-radius:var(--r-md);
  font-weight:700;font-size:16px;transition:transform .12s var(--spring),box-shadow .2s var(--ease);
}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(120deg,var(--current),var(--current-dk));color:#fff;box-shadow:var(--shadow-m)}
.btn-ghost{background:rgba(255,255,255,.6);border:1px solid rgba(16,26,44,.10);color:var(--ink)}
.btn-quiet{min-height:44px;font-size:13.5px;font-weight:600;color:var(--ink-3)}
.w100{width:100%}

.chip{
  display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;
  border-radius:var(--r-sm);background:rgba(255,255,255,.66);
  border:1px solid rgba(16,26,44,.08);font-size:13px;font-weight:700;
}
.chip.honey{color:var(--honey-text)}
.dotname{
  width:22px;height:22px;border-radius:7px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--sa),var(--sd));color:#fff;
  font-family:var(--font-d);font-size:12px;font-weight:800;
}
.iconbtn{
  width:44px;height:44px;display:grid;place-items:center;border-radius:var(--r-sm);
  background:rgba(255,255,255,.6);border:1px solid rgba(16,26,44,.08);
}
.iconbtn svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.topbar{display:flex;align-items:center;gap:8px;width:100%;margin-bottom:14px}
.spacer{flex:1}

/* ── the staircase (signature element) ───────────────────── */
#sidhi{width:min(310px,90%);height:auto;margin:2px 0 12px;overflow:visible}
.st-tread{stroke:var(--current-dk);stroke-width:4.5;stroke-linecap:round;fill:none}
.st-rise{stroke:var(--sd);stroke-width:4.5;stroke-linecap:round;fill:none}
.st-first{stroke:var(--sa);stroke-width:6;stroke-linecap:round}
.st-draw{stroke-dasharray:var(--L);stroke-dashoffset:var(--L);animation:draw .85s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.st-lab{font-family:var(--font-v);font-style:italic;font-size:12.5px;font-weight:600}

/* ── door cards ──────────────────────────────────────────── */
.doorcard{
  width:100%;text-align:left;padding:18px 18px 16px;margin-bottom:12px;position:relative;
  transition:transform .18s var(--spring),box-shadow .22s var(--ease);
}
.doorcard:active{transform:scale(.985)}

.doorcard h2{font-family:var(--font-d);font-weight:800;font-size:23px;letter-spacing:-.02em;margin:3px 0 5px}
.doorcard p{font-size:14px;color:var(--ink-2);line-height:1.55;max-width:23em}
.doorcard .doorart{position:absolute;right:13px;top:15px;width:82px;height:58px;opacity:.95}
.doorcard .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.pill{font-size:11px;font-weight:700;letter-spacing:.04em;padding:4px 9px;border-radius:9px;background:rgba(16,26,44,.06);color:var(--ink-2)}
.pill.done{background:rgba(14,159,91,.14);color:var(--ok-text)}
.pill.acc{background:rgba(47,75,255,.11);color:var(--current-dk)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.minicard{padding:14px;text-align:left;position:relative}
.minicard h3{font-family:var(--font-d);font-weight:800;font-size:16px;margin-bottom:3px}
.minicard .tiny{color:var(--ink-2);display:block}
.badge{
  position:absolute;top:10px;right:10px;min-width:22px;height:22px;padding:0 6px;
  border-radius:11px;background:var(--no);color:#fff;font-size:11.5px;font-weight:800;
  display:grid;place-items:center;
}
.minicard.soon{opacity:.72;cursor:default}
.minicard.soon h3{color:var(--ink-2)}
.badge.soonbadge{
  background:rgba(16,26,44,.5);font-size:9.5px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;height:20px;border-radius:10px;padding:0 9px;
}

/* ── hub list ────────────────────────────────────────────── */
.hubrow{
  width:100%;display:flex;align-items:center;gap:12px;text-align:left;
  padding:14px;margin-bottom:9px;border-radius:var(--r-md);
  background:rgba(255,255,255,.66);border:1px solid rgba(16,26,44,.08);
  transition:transform .14s var(--spring);
}
.hubrow:active{transform:scale(.985)}
.hubrow .ic{
  width:40px;height:40px;flex:0 0 40px;border-radius:13px;display:grid;place-items:center;
  background:var(--tint,rgba(47,75,255,.12));font-family:var(--font-d);font-weight:800;font-size:15px;color:var(--tone,var(--current-dk));
}
.hubrow .txt{flex:1;min-width:0}
.hubrow .txt b{display:block;font-size:15.5px;font-weight:700}
.hubrow .txt span{font-size:12.5px;color:var(--ink-3);display:block;line-height:1.45}
.hubrow .tick{width:22px;height:22px;flex:0 0 22px}
.hubrow .tick svg{width:22px;height:22px;fill:none;stroke:var(--ok);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}

/* ── lesson ──────────────────────────────────────────────── */
.rail{display:flex;gap:5px;margin:0 0 12px;width:100%}
.rail i{flex:1;height:4px;border-radius:2px;background:rgba(16,26,44,.12)}
.rail i.on{background:var(--current)}
.lesson{width:100%;padding:22px 20px}
.lesson h2{font-family:var(--font-d);font-weight:800;font-size:25px;letter-spacing:-.025em;margin:6px 0 10px;line-height:1.14}
.lesson p{font-size:15.5px;color:var(--ink-2);margin-bottom:12px}
.lesson strong{color:var(--ink);font-weight:700}
.lesson .say{
  font-size:15px;color:var(--ink);background:rgba(255,174,24,.13);
  border-left:3px solid var(--honey);border-radius:0 12px 12px 0;
  padding:11px 13px;margin:14px 0;font-weight:600;
}
.lesson .box{
  background:rgba(255,255,255,.62);border:1px solid rgba(16,26,44,.08);
  border-radius:var(--r-md);padding:14px;margin:12px 0;text-align:center;
}
.lesson .box .big{font-family:var(--font-d);font-weight:800;font-size:clamp(23px,5.6vw,31px);letter-spacing:-.02em;line-height:1.3}
.lesson .box .cap{font-size:12.5px;color:var(--ink-3);margin-top:6px}
.lesson ul{margin:0 0 12px 18px}
.lesson li{font-size:15px;color:var(--ink-2);margin-bottom:6px}
.seq{
  font-family:var(--font-d);font-weight:700;font-size:clamp(16px,4.2vw,21px);
  letter-spacing:-.01em;line-height:1.65;word-spacing:.1em;
}
.seq .hi{color:var(--sa-text)}
.blank{
  display:inline-block;min-width:1.7em;padding:0 .18em;text-align:center;
  border:2px dashed rgba(16,26,44,.26);border-radius:9px;color:var(--ink-3);
  line-height:1.15;vertical-align:baseline;
}
.blank.ask{border-color:var(--sa);color:var(--sa-text);border-style:solid}
.seq .gap{color:var(--sd-text)}

/* ── play ────────────────────────────────────────────────── */
.phead{display:flex;align-items:center;gap:8px;width:100%}
.hud{display:flex;align-items:center;gap:9px;flex:1}
.hudnum{font-family:var(--font-d);font-weight:800;font-size:14px;color:var(--ink-2)}
.hudnum.pts{color:var(--current-dk);font-size:17px}
.progress{width:100%;height:4px;border-radius:2px;background:rgba(16,26,44,.10);margin:12px 0 6px;overflow:hidden}
.progress i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,var(--sa),var(--sd));transition:width .3s var(--ease)}
.pbody{width:100%;flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:10px 0}
.pfoot{width:100%;padding-top:8px}

.qkicker{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--ink-3);text-align:center}
.qtext{font-size:15.5px;color:var(--ink-2);text-align:center;line-height:1.55;max-width:32em;margin:0 auto}
.qtext.lead{color:var(--ink);font-weight:600}
.qbig{font-family:var(--font-d);font-weight:800;text-align:center;font-size:clamp(30px,7vw,46px);letter-spacing:-.03em;line-height:1.1}
.qbig.long{font-size:clamp(21px,5vw,32px);line-height:1.24}
.qseq{font-family:var(--font-d);font-weight:800;text-align:center;font-size:clamp(25px,6.4vw,36px);letter-spacing:-.02em;line-height:1.4}
.qseq.long{font-size:clamp(18px,4.6vw,25px)}

.opts{display:flex;flex-direction:column;gap:9px;width:100%}
.opt{
  width:100%;min-height:56px;padding:12px 15px;border-radius:var(--r-md);text-align:left;
  background:rgba(255,255,255,.72);border:1.5px solid rgba(16,26,44,.10);
  font-weight:700;font-size:16px;display:flex;align-items:center;gap:11px;
  transition:transform .12s var(--spring),background .18s var(--ease),border-color .18s var(--ease);
}
.opt:active{transform:scale(.985)}
.opt .k{
  width:26px;height:26px;flex:0 0 26px;border-radius:8px;display:grid;place-items:center;
  background:rgba(16,26,44,.07);font-family:var(--font-d);font-size:12px;font-weight:800;color:var(--ink-2);
}
.opt .lb{flex:1;min-width:0}
.opt.good{background:rgba(14,159,91,.15);border-color:var(--ok)}
.opt.good .k{background:var(--ok);color:#fff}
.opt.bad{background:rgba(225,67,56,.13);border-color:var(--no)}
.opt.bad .k{background:var(--no);color:#fff}
.opt[disabled]{opacity:.62}
.opt.good[disabled],.opt.bad[disabled]{opacity:1}
.opt.seqopt{font-family:var(--font-d);font-weight:700;font-size:15px;letter-spacing:-.01em}

/* typed answer + our own keypad */
.typed{
  width:100%;min-height:64px;border-radius:var(--r-md);
  background:rgba(255,255,255,.78);border:1.5px solid rgba(16,26,44,.12);
  display:flex;align-items:center;justify-content:center;padding:8px 14px;
  font-family:var(--font-d);font-weight:800;font-size:clamp(24px,4.4vw,32px);letter-spacing:-.02em;
}
.typed.empty{color:var(--ink-3)}
.typed.good{border-color:var(--ok);background:rgba(14,159,91,.12)}
.typed.bad{border-color:var(--no);background:rgba(225,67,56,.11)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;margin-top:10px}
.pad button{
  min-height:52px;border-radius:var(--r-sm);background:rgba(255,255,255,.74);
  border:1px solid rgba(16,26,44,.09);font-family:var(--font-d);font-weight:800;font-size:20px;
  transition:transform .1s var(--spring),background .15s var(--ease);
}
.pad button:active{transform:scale(.94);background:rgba(255,255,255,.95)}
.pad button.sm{font-size:14px}

/* feedback sheet */
#sheetHost{position:fixed;inset:0;z-index:40;pointer-events:none}
.scrim{position:absolute;inset:0;background:rgba(16,26,44,.42);opacity:0;transition:opacity .26s var(--ease)}
.sheet{
  position:absolute;left:0;right:0;bottom:0;max-height:88dvh;overflow-y:auto;
  background:var(--paper);border-radius:28px 28px 0 0;
  padding:10px 20px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(102%);transition:transform .32s var(--ease);
  box-shadow:var(--shadow-l);
}
#sheetHost.on{pointer-events:auto}
#sheetHost.on .scrim{opacity:1}
#sheetHost.on .sheet{transform:none}
.grab{width:38px;height:4px;border-radius:2px;background:rgba(16,26,44,.18);margin:6px auto 12px}
.verdict{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.verdict .mark{width:34px;height:34px;flex:0 0 34px;border-radius:11px;display:grid;place-items:center}
.verdict .mark svg{width:19px;height:19px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.verdict.ok .mark{background:var(--ok)}
.verdict.no .mark{background:var(--no)}
.verdict h3{font-family:var(--font-d);font-weight:800;font-size:20px;letter-spacing:-.02em}
.diag{font-size:14.5px;color:var(--ink-2);margin-bottom:6px}
.work{display:flex;flex-direction:column;gap:7px;margin:10px 0 14px}
.work .ln{
  background:rgba(255,255,255,.68);border:1px solid rgba(16,26,44,.07);
  border-radius:12px;padding:9px 12px;font-size:15px;
  animation:lnIn .3s var(--ease) backwards;
}

.work .ln .why{display:block;font-size:12.5px;color:var(--ink-3);font-weight:600;margin-top:2px}
.sheet h4{font-family:var(--font-d);font-weight:800;font-size:17px;margin:4px 0 8px}

/* report */
.scorecard{width:100%;padding:24px 20px;text-align:center;margin-bottom:12px}
.scorecard .n{
  font-family:var(--font-d);font-weight:800;font-size:clamp(48px,13vw,72px);line-height:1;letter-spacing:-.04em;
  background:linear-gradient(120deg,var(--current-dk),var(--sd));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;margin:12px 0}
.stat{background:rgba(255,255,255,.62);border:1px solid rgba(16,26,44,.07);border-radius:var(--r-sm);padding:10px 8px;text-align:center}
.stat b{display:block;font-family:var(--font-d);font-weight:800;font-size:19px;letter-spacing:-.02em}
.stat span{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:var(--ink-3)}
.panel{width:100%;padding:16px 18px;margin-bottom:12px}
.topicrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(16,26,44,.07)}
.topicrow:last-child{border-bottom:0}
.topicrow .nm{flex:1;font-size:14.5px;font-weight:600}
.bar{width:74px;height:6px;border-radius:3px;background:rgba(16,26,44,.10);overflow:hidden;flex:0 0 74px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--ok)}
.bar i.weak{background:var(--no)}
.btn-wa{background:#25d366;color:#08331b}
.logrow{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid rgba(16,26,44,.06);font-size:13.5px}
.logrow:last-child{border-bottom:0}
.logrow b{font-family:var(--font-d);font-weight:800}

/* misc */
#toast{
  position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
  background:var(--ink);color:#fff;padding:11px 17px;border-radius:14px;font-size:14px;font-weight:600;
  opacity:0;pointer-events:none;transition:all .26s var(--ease);z-index:60;max-width:88vw;text-align:center;
}
#toast.on{opacity:1;transform:translate(-50%,0)}
.namefield{
  width:100%;min-height:52px;border-radius:var(--r-md);padding:0 16px;
  background:rgba(255,255,255,.8);border:1.5px solid rgba(16,26,44,.12);
  font:700 17px/1 var(--font-b);color:var(--ink);text-align:center;
}
.switchrow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid rgba(16,26,44,.07)}
.switchrow:last-child{border-bottom:0}
.switchrow .lbl{flex:1}
.switchrow .lbl b{display:block;font-size:15px}
.switchrow .lbl span{font-size:12.5px;color:var(--ink-3)}
.sw{width:50px;height:30px;border-radius:15px;background:rgba(16,26,44,.16);position:relative;transition:background .2s var(--ease);flex:0 0 50px}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:12px;background:#fff;box-shadow:var(--shadow-s);transition:transform .22s var(--spring)}
.sw.on{background:var(--current)}
.sw.on i{transform:translateX(20px)}

.shake{animation:shk .34s var(--ease)}
@keyframes shk{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(4px)}50%{transform:translateX(-4px)}}
.pop{animation:pp .34s var(--spring)}
@keyframes pp{50%{transform:scale(1.13)}}

@media (max-width:680px){
  body.playing{position:fixed;inset:0;overflow:hidden;width:100%}
  body.playing #s-play.on{height:100dvh;max-height:100dvh}
  body.playing #s-play .pbody{overflow-y:auto}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;
  }
}
</style>

<script>
'use strict';

/* ════════════════════════════════════════════════════════════════
   FLUENCE · SIDHI — Arithmetic Progression, class 10 chapter 5.

   Built from the 30–31 August class transcripts. Every worked
   line, every analogy and every wrong option in here came out of
   that room: the staircase (8 steps, 7 gaps), the cheat-code rule
   (AP ka rule sirf AP pe chalega), paisa for decimals, and the
   errors the students actually made — a + nd instead of
   a + (n−1)d, a₁ − a₂ for the common difference, calling
   0.2, 0.22, 0.222 an AP because it "looks" patterned.

   Questions are generated fresh every time. There is no bank.
   ════════════════════════════════════════════════════════════════ */

const CFG = {
  appId:'sidhi',
  store:'fluence.ap.v1',
  runLen:{ pattern:10, formula:10, word:8, mixed:12, weekly:12, revenge:10, check:3 },
  teacher:'Aman Sir',
  atoms:'AP1 AP2 AP3 AP4 AP5 AP6'          // atoms this game drills (see MATH-ATLAS)
};

/* ═══ 1. NUMBERS — exact rationals, never floats ══════════════ */
const MINUS='−';                       /* U+2212, never ASCII '-' */
const DOTS='…';
const TIMES='×';

function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ const t=a%b; a=b; b=t; } return a||1; }
function F(n,d){
  if(d===undefined)d=1;
  if(d===0)throw new Error('Frac /0');
  if(d<0){ n=-n; d=-d; }
  const g=gcd(n,d);
  return {n:n/g, d:d/g};
}
const Fz=F(0), Fone=F(1);
function Fadd(a,b){ return F(a.n*b.d+b.n*a.d, a.d*b.d); }
function Fsub(a,b){ return F(a.n*b.d-b.n*a.d, a.d*b.d); }
function Fmul(a,b){ return F(a.n*b.n, a.d*b.d); }
function Fdiv(a,b){ if(b.n===0)throw new Error('Frac /0'); return F(a.n*b.d, a.d*b.n); }
function Fscale(a,k){ return F(a.n*k, a.d); }
function Fneg(a){ return F(-a.n, a.d); }
function Fabs(a){ return F(Math.abs(a.n), a.d); }
function Feq(a,b){ return a.n===b.n && a.d===b.d; }
function Fis0(a){ return a.n===0; }
function Fneg_(a){ return a.n<0; }
function Fnum(a){ return a.n/a.d; }           /* comparisons only — never for display */
function Fint(a){ return a.d===1; }

/* string-built decimals: 0.03/100 in JS is 0.00030000000000000003 */
function decStr(f){
  if(f.d===1)return (f.n<0?MINUS:'')+Math.abs(f.n);
  if(1000%f.d!==0)return null;
  const sc=f.n*(1000/f.d);                    /* exact integer thousandths */
  const neg=sc<0, a=Math.abs(sc);
  let frac=String(a%1000).padStart(3,'0').replace(/0+$/,'');
  return (neg?MINUS:'')+Math.floor(a/1000)+(frac?'.'+frac:'');
}
function moneyStr(f){                          /* rupees: whole, else exactly two places */
  if(f.d===1)return String(Math.abs(f.n)).replace(/^/,f.n<0?MINUS:'');
  if(100%f.d!==0)return decStr(f);
  const sc=f.n*(100/f.d), neg=sc<0, a=Math.abs(sc);
  if(a%100===0)return (neg?MINUS:'')+(a/100);
  return (neg?MINUS:'')+Math.floor(a/100)+'.'+String(a%100).padStart(2,'0');
}
function fracStr(f){
  if(f.d===1)return (f.n<0?MINUS:'')+Math.abs(f.n);
  return (f.n<0?MINUS:'')+Math.abs(f.n)+'/'+f.d;
}
/* the default: integers plain, tidy decimals as decimals, else a fraction */
function fmt(f,style){
  if(style==='money')return moneyStr(f);
  if(style==='frac')return fracStr(f);
  if(style==='dec'){ const s=decStr(f); return s!==null?s:fracStr(f); }
  if(f.d===1)return (f.n<0?MINUS:'')+Math.abs(f.n);
  const s=decStr(f);
  return s!==null?s:fracStr(f);
}
/* what a student would type on the pad for this value */
function typedForm(f,style){
  const s=fmt(f,style);
  return s.replace(/−/g,'-');
}

/* ═══ 2. RANDOM (swappable, so the weekly paper can be seeded) ═ */
let rng=Math.random;
function rnd(a,b){ return a+Math.floor(rng()*(b-a+1)); }
function pick(arr){ return arr[Math.floor(rng()*arr.length)]; }
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function nz(a,b){ let v=rnd(a,b); if(v===0)v=b||1; return v; }       /* never zero */
function mulberry32(s){
  return function(){
    s|=0; s=s+0x6D2B79F5|0;
    let t=Math.imul(s^s>>>15, 1|s);
    t=t+Math.imul(t^t>>>7, 61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
function strHash(str){
  let h=2166136261;
  for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); }
  return h>>>0;
}
function isoWeekKey(dt){
  const d=new Date(Date.UTC(dt.getFullYear(),dt.getMonth(),dt.getDate()));
  const day=d.getUTCDay()||7;
  d.setUTCDate(d.getUTCDate()+4-day);
  const y0=new Date(Date.UTC(d.getUTCFullYear(),0,1));
  const wk=Math.ceil(((d-y0)/86400000+1)/7);
  return d.getUTCFullYear()+'-W'+String(wk).padStart(2,'0');
}

/* ═══ 3. SEQUENCE HELPERS ═════════════════════════════════════ */
/* An AP is nothing but {a, d}. Everything else is derived. */
function term(a,d,n){ return Fadd(a, Fscale(d, n-1)); }
function seqStr(a,d,count,style,opts){
  opts=opts||{};
  const out=[];
  for(let i=1;i<=count;i++)out.push(fmt(term(a,d,i),style));
  let s=out.join(', ');
  if(opts.dots!==false)s+=', '+DOTS;
  if(opts.last!==undefined)s+=', '+opts.last;
  return s;
}
function nOf(a,d,val){                        /* position of val, or null if not a term */
  if(Fis0(d))return null;
  const q=Fdiv(Fsub(val,a),d);
  if(q.d!==1)return null;
  const n=q.n+1;
  return n>=1?n:null;
}

/* ═══ 4. STORAGE ══════════════════════════════════════════════ */
const Store={
  d:null,
  boot(){
    let raw=null;
    try{ raw=localStorage.getItem(CFG.store); }catch(e){}
    try{ this.d=raw?JSON.parse(raw):null; }catch(e){ this.d=null; }
    if(!this.d||typeof this.d!=='object')this.d={v:1,who:'',players:{}};
    if(!this.d.players)this.d.players={};
    if(this.d.who&&!this.d.players[this.d.who])this.mk(this.d.who);
    return this;
  },
  mk(name){
    this.d.players[name]={
      pts:0, runs:0, streak:0, lastDay:'',
      best:{},          /* mode -> {pts,acc,time} */
      lessons:{},       /* lessonId -> true */
      topics:{},        /* topicId -> {r:right, w:wrong} */
      bank:[],          /* mistake bank: {topic, q, ts} */
      weekly:{},        /* weekKey -> {first,best,attempts} */
      log:[]            /* last 40 runs */
    };
    this.d.who=name; this.save();
  },
  p(){ return this.d.who ? (this.d.players[this.d.who]||null) : null; },
  save(){ try{ localStorage.setItem(CFG.store, JSON.stringify(this.d)); }catch(e){} },
  today(){ const t=new Date(); return t.getFullYear()+'-'+(t.getMonth()+1)+'-'+t.getDate(); },
  bumpStreak(){
    const p=this.p(); if(!p)return;
    const td=this.today();
    if(p.lastDay===td)return;
    const y=new Date(); y.setDate(y.getDate()-1);
    const yd=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();
    p.streak=(p.lastDay===yd)?(p.streak||0)+1:1;
    p.lastDay=td; this.save();
  },
  liveStreak(){
    const p=this.p(); if(!p||!p.lastDay)return 0;
    const td=this.today();
    const y=new Date(); y.setDate(y.getDate()-1);
    const yd=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();
    return (p.lastDay===td||p.lastDay===yd)?(p.streak||0):0;
  },
  scoreTopic(topic,ok){
    const p=this.p(); if(!p)return;
    if(!p.topics[topic])p.topics[topic]={r:0,w:0};
    p.topics[topic][ok?'r':'w']++;
  },
  bankAdd(q){
    const p=this.p(); if(!p||!q||!q.topic)return;
    p.bank=p.bank||[];
    if(p.bank.length>=40)p.bank.shift();
    p.bank.push({topic:q.topic, ts:Date.now()});
  },
  bankClear(topic){
    const p=this.p(); if(!p||!p.bank)return;
    const i=p.bank.findIndex(b=>b.topic===topic);
    if(i>=0)p.bank.splice(i,1);
  }
};

/* ═══ 5. SOUND — synthesized, no files ════════════════════════ */
const Snd={
  ctx:null, on:true, haptics:true,
  boot(){
    try{
      const s=localStorage.getItem(CFG.store+'.snd');
      if(s!==null)this.on=s==='1';
      const h=localStorage.getItem(CFG.store+'.hap');
      if(h!==null)this.haptics=h==='1';
    }catch(e){}
    return this;
  },
  set(v){ this.on=v; try{ localStorage.setItem(CFG.store+'.snd', v?'1':'0'); }catch(e){} if(v)this.wake(); },
  setHap(v){ this.haptics=v; try{ localStorage.setItem(CFG.store+'.hap', v?'1':'0'); }catch(e){} },
  wake(){
    if(this.ctx)return this.ctx;
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return null;
      this.ctx=new AC();
      if(this.ctx.state==='suspended')this.ctx.resume();
    }catch(e){ this.ctx=null; }
    return this.ctx;
  },
  tone(freq,dur,type,vol,slideTo,lp){
    if(!this.on)return;
    const c=this.wake(); if(!c)return;
    const t=c.currentTime;
    const o=c.createOscillator(), g=c.createGain();
    o.type=type||'sine';
    o.frequency.setValueAtTime(freq,t);
    if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime((vol||0.45)*0.45, t+0.014);   /* ~14ms attack */
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    let node=o;
    if(lp){ const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lp; o.connect(f); node=f; }
    node.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t+dur+0.02);
  },
  key(){ this.tone(1180,0.03,'sine',0.18); },
  tap(){ this.tone(720,0.07,'sine',0.32); },
  right(streak){
    const base=[659.25,987.77,1318.5];         /* E5 · B5 · E6 */
    base.forEach((f,i)=>setTimeout(()=>this.tone(f*(streak>4?1.06:1),0.16,'triangle',0.34),i*70));
    this.buzz([12,40,12]);
  },
  wrong(){ this.tone(210,0.30,'sine',0.30,128,700); this.buzz(90); },
  done(){
    [523.25,659.25,783.99,1046.5].forEach((f,i)=>setTimeout(()=>this.tone(f,0.34,'triangle',0.30),i*110));
    this.tone(130.81,1.1,'sine',0.14);
  },
  buzz(p){
    if(!this.haptics)return;
    try{
      const ua=navigator.userActivation;
      if(ua&&!ua.hasBeenActive)return;      /* keeps the console clean before the first real tap */
      navigator.vibrate&&navigator.vibrate(p);
    }catch(e){}
  }
};

/* one sheet at a time; closes via the cross, the scrim and Escape */
let sheetClose=null;
function openSheet(html,opts){
  opts=opts||{};
  const host=$('sheetHost');
  host.innerHTML='<div class="scrim"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>'+html+'</div>';
  void host.offsetHeight;                 /* force layout so the slide has a start value */

  const done=()=>{

  if(!opts.locked)host.querySelector('.scrim').addEventListener('click',done);
  host.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',done));
  return done;
}
function closeSheet(){ if(sheetClose)sheetClose(); }

/* write the true value first, then animate toward it */
function countTo(el,target,ms){
  el.textContent=target;
  if(REDUCED())return;
  const from=0, t0=performance.now(), dur=ms||700;
  const step=now=>{
    const k=Math.min(1,(now-t0)/dur);
    el.textContent=Math.round(from+(target-from)*(1-Math.pow(1-k,3)));
    if(k<1)requestAnimationFrame(step); else el.textContent=target;
  };
  requestAnimationFrame(step);
}

/* ════════════════════════════════════════════════════════════════

function ord(n){
  const s=['th','st','nd','rd'], v=n%100;
  return n+(s[(v-20)%10]||s[v]||s[0]);
}
/* the pad produces digits, one dot and a sign — nothing else. A value is
   typeable only if it is displayed as one of those, so the display style
   matters as much as the value. */
function canType(f,style){
  if(style==='frac')return false;
  return f.d===1 || 100%f.d===0;
}
function styleFor(f){ return f.d===1 ? 'auto' : (100%f.d===0 ? 'money' : 'frac'); }

/* build a 4-option MCQ from {lb, ok, why} entries: exactly one ok,
   all labels distinct, order shuffled */
function opts4(list){
  const seen=new Set(), out=[];
  for(const o of list){
    if(o==null)continue;
    if(seen.has(o.lb))continue;
    if(!o.ok && out.some(x=>x.ok&&x.lb===o.lb))continue;
    seen.add(o.lb); out.push(o);
    if(out.length===4)break;
  }
  return shuffle(out);
}

/* ── 1 · IS IT AN AP? ──────────────────────────────────────── */
const NO_REASONS=[
  'Nahi — gaps equal nahi hain',
  'Nahi — har baar multiply ho raha hai, add nahi',
  'Nahi — gap khud badhta ja raha hai',
  'Nahi — sirf shuru ke do gap equal hain',
  'Nahi — power badh rahi hai, term nahi'
];

function apFamily(lvl){
  const F_=[];
  /* — genuine APs — */
  F_.push(()=>{ const a=nz(-9,14), d=nz(2,9);
    return {terms:[1,2,3,4].map(i=>fmt(term(F(a),F(d),i))), yes:true, dLab:fmt(F(d)), g1:F(d)}; });
  F_.push(()=>{ const a=nz(4,30), d=-nz(2,7);
    return {terms:[1,2,3,4].map(i=>fmt(term(F(a),F(d),i))), yes:true, dLab:fmt(F(d)), g1:F(d)}; });
  F_.push(()=>{ const a=nz(-6,9);
    return {terms:[a,a,a,a].map(x=>fmt(F(x))), yes:true, dLab:'0', g1:Fz,
            note:'Gap zero bhi ek equal gap hai. Har term mein 0 add ho raha hai.'}; });
  F_.push(()=>{ const v=pick(['a','x','k']);
    return {terms:[v,'2'+v,'3'+v,'4'+v], yes:true, dLab:v, g1:null, symbolic:true,
            note:v+', 2'+v+', 3'+v+' — har baar ek '+v+' aur add ho raha hai.'}; });
  F_.push(()=>{ const b=nz(2,7), r=pick([2,3,5,7]);
    return {terms:[String(b), b+'+&radic;'+r, b+'+2&radic;'+r, b+'+3&radic;'+r],
            yes:true, dLab:'&radic;'+r, g1:null, symbolic:true,
            note:'Har baar ek &radic;'+r+' aur add ho raha hai — gap equal hai.'}; });
  if(lvl>1)F_.push(()=>{ const a=nz(1,6), n=nz(1,4), d2=pick([2,3,4]);
    return {terms:[0,1,2,3].map(i=>fracStr(Fadd(F(a),Fscale(F(n,d2),i)))),
            yes:true, dLab:fracStr(F(n,d2)), g1:F(n,d2)}; });
  F_.push(()=>{ const r=pick([2,3,5]);
    return {terms:[1,2,3,4].map(i=>'&radic;'+(i*i*r)), yes:true, dLab:'&radic;'+r, g1:null, symbolic:true,
            note:'Simplify karo: &radic;'+r+', 2&radic;'+r+', 3&radic;'+r+', 4&radic;'+r+' — har baar ek &radic;'+r+' add ho raha hai.'}; });
  F_.push(()=>{ const r=pick([3,5,7]);
    return {terms:[1,2,3,4].map(i=>'&radic;'+(i*r)), yes:false, dLab:'&radic;'+r,
            why:'Nahi — gaps equal nahi hain', g1:null, symbolic:true,
            note:'Andar ke numbers AP me hain, lekin root lagne ke baad gaps equal nahi rehte. Value find karke dekho.'}; });
  F_.push(()=>{ const a0=rnd(-6,6), dd=pick([2,-2,3,-3]);
    const A=F(a0*10+pick([2,5,8]),10), D=F(dd*10,10);
    return {terms:[1,2,3,4].map(i=>decStr(term(A,D,i))), yes:true, dLab:decStr(D), g1:D,
            note:'Decimal se mat darna — gap wahi ek jaisa hai.'}; });
  if(lvl>1)F_.push(()=>{ const a0=rnd(-4,4)*25, dd=pick([25,50,-25,-75]);
    const A=F(a0,100), D=F(dd,100);
    return {terms:[1,2,3,4].map(i=>moneyStr(term(A,D,i))), yes:true, dLab:moneyStr(D), g1:D,
            note:'Paise ki tarah dekho — har baar utna hi add ho raha hai.'}; });

  /* — not APs — */
  F_.push(()=>{ const b=pick([2,3]), a=nz(1,3);
    return {terms:[a,a*b,a*b*b,a*b*b*b].map(x=>fmt(F(x))), yes:false,
            why:'Nahi — har baar multiply ho raha hai, add nahi',
            g1:F(a*b-a), note:'Ye '+b+' se multiply ho raha hai. Chess ke chawal wali kahani yaad hai? Wo AP nahi, wo aur tez bhagta hai.'}; });
  F_.push(()=>{ const s=nz(1,3);
    return {terms:[s,s+1,s+2,s+3].map(i=>i+'&sup2;'), yes:false, dLab:'1',
            why:'Nahi — gap khud badhta ja raha hai', g1:null, symbolic:true,
            note:'Value find karo: '+[s,s+1,s+2,s+3].map(i=>i*i).join(', ')+'. Gaps alag alag hain.'}; });
  F_.push(()=>{ const s=pick([1,3,5]);
    return {terms:[s,s+2,s+4,s+6].map(i=>i+'&sup2;'), yes:false, dLab:'2',
            why:'Nahi — gap khud badhta ja raha hai', g1:null, symbolic:true,
            note:'Andar odd numbers hain, lekin square karne ke baad '+[s,s+2,s+4,s+6].map(i=>i*i).join(', ')+' — gaps equal nahi.'}; });
  F_.push(()=>{ const v=pick(['a','x']);
    return {terms:[v,v+'&sup2;',v+'&sup3;',v+'&#8308;'], yes:false, dLab:v,
            why:'Nahi — power badh rahi hai, term nahi', g1:null, symbolic:true,
            note:v+'&sup2; me se '+v+' minus nahi hota — jaise x&sup2; me se x subtract nahi kar sakte.'}; });
  F_.push(()=>{ const k=pick([2,3]);
    return {terms:['0.'+k, '0.'+k+k, '0.'+k+k+k, '0.'+k+k+k+k], yes:false, dLab:'0.0'+k,
            why:'Nahi — gaps equal nahi hain', g1:null, symbolic:true,
            note:'Paise mein dekho: 0.'+k+' aur 0.0'+k+' ek cheez nahi hai. Pehla gap 0.0'+k+', doosra 0.00'+k+'.'}; });
  F_.push(()=>{ const a=nz(2,9), d=nz(2,6);
    const t=[a,a+d,a+2*d,a+3*d+nz(1,3)];
    return {terms:t.map(x=>fmt(F(x))), yes:false,
            why:'Nahi — sirf shuru ke do gap equal hain', g1:F(d),
            note:'Isiliye paanch se zyada terms ho toh a&#8324; &minus; a&#8323; bhi check karna. Shuru mein pattern chalta hai, aage badal deta hai.'}; });
  F_.push(()=>{ const P=pick([10000,20000,5000]), r=pick([8,10]);
    const v=[P]; for(let i=0;i<3;i++)v.push(Math.round(v[v.length-1]*(100+r)/100));
    return {terms:v.map(x=>fmt(F(x))), yes:false,
            why:'Nahi — gap khud badhta ja raha hai', g1:F(v[1]-v[0]),
            note:'Compound interest hai. Pehle saal '+(v[1]-v[0])+' ka byaaj, doosre saal '+(v[2]-v[1])+' ka. Interest hi badalta ja raha hai.'}; });
  return pick(F_)();
}

function gIsAP(lvl){
  const f=apFamily(lvl);
  const st = g=>g.d===1?'auto':(100%g.d===0?'money':'frac');
  const g1lab = f.g1 ? fmt(f.g1, st(f.g1)) : String(f.dLab);
  let flip = f.g1 ? fmt(Fneg(f.g1), st(f.g1))
                  : (g1lab.startsWith(MINUS)?g1lab.slice(1):MINUS+g1lab);
  let flipWhy='Sign ulta ho gaya. '+VD+' = a&#8322; &minus; a&#8321;, pehle wale me se doosra nahi.';
  if(flip===g1lab){                       /* d = 0 — negating it changes nothing */
    flip=f.terms[0];
    flipWhy='Ye pehla term hai, gap nahi. Yahan gap zero ka hai — aur zero bhi ek equal gap hai.';
  }
  const trueNo = f.why || NO_REASONS[0];
  const decoyNo = pick(NO_REASONS.filter(r=>r!==trueNo));
  const list=[
    {lb:'Haan — '+VD+' = '+g1lab, ok:!!f.yes, why:f.yes?'':'Pehla gap dekh ke haan bol diya. Aage ke gaps bhi check karo.'},
    {lb:'Haan — '+VD+' = '+flip,  ok:false,   why:flipWhy},
    {lb:trueNo,  ok:!f.yes, why:f.yes?'Gaps toh equal hain — check karke dekho.':''},
    {lb:decoyNo, ok:false,  why:'Reason theek nahi hai.'}
  ];
  return {
    topic:'isap', kicker:'AP hai ya nahi',
    lead:'Ye AP hai kya?',
    seq:f.terms.join(', ')+', '+DOTS,
    mode:'mcq', opts:opts4(list),
    ansLabel:(f.yes?'Haan — d = '+f.dLab:trueNo),
    work:[
      {t:'a&#8322; &minus; a&#8321; = '+f.terms[1]+' &minus; '+f.terms[0], why:'Doosre term me se pehla subtract karo.'},
      {t:'a&#8323; &minus; a&#8322; = '+f.terms[2]+' &minus; '+f.terms[1], why:'Phir teesre me se doosra.'},
      {t:(f.yes?'Dono equal aa rahe hain &rarr; ye AP hai, '+VD+' = '+f.dLab
               :'Dono equal nahi aa rahe &rarr; ye AP nahi hai.'), why:f.note||''}
    ],
    say:f.yes?'Gap equal = AP. Bas itni si baat hai.'
             :'Yaad rakho — AP ka rule sirf AP pe chalega. Ek game ka cheat code doosre game me nahi chalta.'
  };
}

/* ── 2 · FIND a AND d ──────────────────────────────────────── */
function gFindD(lvl){
  let a,d,style='auto';
  if(lvl===1){ a=F(nz(1,15)); d=F(nz(2,9)); }
  else if(lvl===2){ a=F(nz(-14,14)); d=F(-nz(2,9)); }
  else{
    if(rng()<0.5){ const k=pick([25,50,75,-25,-50]); a=F(rnd(-4,6)*25,100); d=F(k,100); style='money'; }
    else{ const dn=pick([2,3,4]); a=F(nz(-4,6)); d=F(nz(1,5),dn); style='frac'; }
  }
  const seq=seqStr(a,d,4,style);
  const wrong=[
    {v:Fneg(d), why:'Ye a&#8321; &minus; a&#8322; hai. Hamesha baad wale me se pehle wala subtract karo.'},
    {v:Fscale(d,2), why:'Ye a&#8323; &minus; a&#8321; hai — do gap ek saath. Ek gap chahiye.'},
    {v:term(a,d,2), why:'Ye doosra term hai, gap nahi.'},
    {v:a, why:'Ye pehla term hai. '+VD+' gap hota hai.'},
    {v:term(a,d,3), why:'Ye teesra term hai, gap nahi.'},
    {v:Fscale(d,3), why:'Ye teen gap ek saath hain.'}
  ].filter(w=>!Feq(w.v,d));
  const canT = lvl===3 && canType(d,style);
  return {
    topic:'findd', kicker:'Common difference',
    lead:'Is AP ka common difference '+VD+' kya hai?',
    seq:seq,
    mode:canT?'type':'mcq',
    opts:canT?null:opts4([{lb:fmt(d,style),ok:true}].concat(
      shuffle(wrong).map(w=>({lb:fmt(w.v,style),ok:false,why:w.why})))),
    ansLabel:fmt(d,style), ansTyped:typedForm(d,style),
    work:[
      {t:VD+' = a&#8322; &minus; a&#8321; = '+fmt(term(a,d,2),style)+' &minus; '+fmt(a,style)+' = '+fmt(d,style),
       why:'Koi bhi term pakdo, uske pichle wale ko subtract karo.'},
      {t:'Check: a&#8323; &minus; a&#8322; = '+fmt(term(a,d,3),style)+' &minus; '+fmt(term(a,d,2),style)+' = '+fmt(d,style),
       why:'Barabar aaya — matlab sach me AP hai.'}
    ],
    say:'Baad wale me se pehle wala. Ulta karoge toh sign ulta aa jayega.'
  };
}

function gFindAD(lvl){
  let a,d,style='auto';
  if(lvl===1){ a=F(nz(1,12)); d=F(nz(2,7)); }
  else if(lvl===2){ a=F(nz(-12,12)); d=F(-nz(2,8)); }
  else if(rng()<0.5){ const dn=pick([2,3,4]); a=F(nz(-5,8)); d=F(nz(-6,6)||1,dn); style='frac'; }

    {lb:VA+' = '+fmt(term(a,d,2),style)+', '+VD+' = '+fmt(d,style), ok:false, why:VA+' pehla term hota hai, doosra nahi.'},

/* ── 3 · BUILD THE AP FROM a AND d ─────────────────────────── */
function gBuild(lvl){
  let a,d,style='auto';
  if(lvl===1){ a=F(pick([1,3,5,10,7])); d=F(pick([2,3,4,5,10])); }
  else if(lvl===2){
    a=F(nz(-9,9));
    d=rng()<0.18 ? Fz : F(nz(-8,8));        /* a = −2, d = 0 is in the book */
  }
  else{
    if(rng()<0.5){ a=F(nz(-3,3)); d=F(pick([1,-1,3,-3]),pick([2,3,4])); style='frac'; }
    else{ a=F(pick([-125,-100,150,-75]),100); d=F(pick([-25,25,-50,50]),100); style='money'; }
  }
  const right=seqStr(a,d,4,style,{dots:false});
  const gp=[fmt(a,style)];                       /* multiplied instead of added */
  let cur=a;
  for(let i=0;i<3;i++){ cur=Fis0(d)?Fz:Fmul(cur,d); gp.push(fmt(cur,style)); }
  const onlyFirst=[fmt(a,style),fmt(Fadd(a,d),style),fmt(Fadd(a,d),style),fmt(Fadd(a,d),style)].join(', ');
  const flipped=seqStr(a,Fneg(d),4,style,{dots:false});
  /* with d = 0 the sign-flip and the multiply both land on the right answer,
     so that case gets its own set of real mistakes */
  const list = Fis0(d) ? [
    {lb:right, ok:true},
    {lb:[fmt(a,style),'0','0','0'].join(', '), ok:false,
     why:VD+' = 0 ka matlab har term me 0 add hota hai — terms zero nahi ho jaate.'},
    {lb:seqStr(a,Fone,4,style,{dots:false}), ok:false,
     why:VD+' = 0 hai, 1 nahi. Kuch add hi nahi ho raha.'},
    {lb:['0','0','0','0'].join(', '), ok:false, why:'Pehla term '+fmt(a,style)+' hai, 0 nahi.'},
    {lb:seqStr(a,Fneg(Fone),4,style,{dots:false}), ok:false, why:'Kuch subtract bhi nahi ho raha — gap zero hai.'}
  ] : [
    {lb:right, ok:true},
    {lb:flipped, ok:false, why:VD+' ka sign ulta laga diya.'},
    {lb:gp.join(', '), ok:false, why:VD+' ko multiply kiya hai. AP me '+VD+' add hota hai.'},
    {lb:onlyFirst, ok:false, why:'Sirf pehle term me '+VD+' add kiya. Har term me add karna hai.'},
    {lb:seqStr(a,Fscale(d,2),4,style,{dots:false}), ok:false, why:'Har baar do gap add kar diye.'},
    {lb:seqStr(Fadd(a,d),d,4,style,{dots:false}), ok:false, why:'Pehle term me hi '+VD+' add kar diya. '+VA+' waisa ka waisa rehta hai.'}
  ];
  return {
    topic:'build', kicker:'AP banao',
    lead:VA+' = '+fmt(a,style)+' aur '+VD+' = '+fmt(d,style)+' hai. Pehle chaar term kaunse honge?',
    mode:'mcq', opts:opts4(list), ansLabel:right, seqOpts:true,
    work:[
      {t:'a&#8321; = '+fmt(a,style), why:'Pehla term diya hua hai.'},
      {t:'a&#8322; = '+fmt(a,style)+' + '+fmt(d,style)+' = '+fmt(term(a,d,2),style), why:'Pehle term me '+VD+' add karo.'},
      {t:'a&#8323; = '+fmt(term(a,d,2),style)+' + '+fmt(d,style)+' = '+fmt(term(a,d,3),style), why:'Phir usme '+VD+' add karo.'},
      {t:'a&#8324; = '+fmt(term(a,d,3),style)+' + '+fmt(d,style)+' = '+fmt(term(a,d,4),style), why:'Bas yahi chalta rehta hai.'}
    ],
    say:'Har term me '+VD+' add karte jao. MCQ me yahi seedha poochha jata hai.'
  };
}

/* ── 4 · nth TERM ──────────────────────────────────────────── */
function gNth(lvl){
  let a,d,style='auto',n;
  if(lvl===1){ a=F(nz(1,12)); d=F(nz(2,7)); n=rnd(8,20); }
  else if(lvl===2){ a=F(nz(-15,15)); d=F(nz(-9,9)); n=rnd(15,60); }
  else{
    n=pick([89,97,99,50,77,101,120]);
    if(rng()<0.35){ a=F(nz(-4,6)); d=F(pick([1,3,-1,-3]),pick([2,4])); style='frac'; }
    else{ a=F(nz(-20,20)); d=F(nz(-12,12)); }
  }
  const ans=term(a,d,n);
  const wrong=[
    {v:term(a,d,n+1), why:'Ye a + '+VN+'&middot;'+VD+' hai. '+n+'th term me '+(n-1)+' gaps hote hain — ek kam.'},
    {v:term(a,d,n-1), why:'Ek gap kam le liya. '+n+'th term = '+VA+' + '+(n-1)+VD+'.'},
    {v:Fscale(d,n), why:VA+' add karna bhool gaye.'},
    {v:Fsub(a,Fscale(d,n-1)), why:VD+' ka sign ulta laga diya.'},
    {v:a, why:'Ye pehla term hai. '+n+'th find karna tha.'},
    {v:Fscale(d,n-1), why:VA+' add karna bhool gaye — sirf gaps add kar diye.'}
  ].filter(w=>!Feq(w.v,ans));
  const canT = lvl===3 && canType(ans,style);
  const nth=ord(n);
  return {
    topic:'nth', kicker:'nth term',
    lead:'Is AP ka '+nth+' term kya hoga?',
    seq:seqStr(a,d,4,style),
    mode:canT?'type':'mcq',
    opts:canT?null:opts4([{lb:fmt(ans,style),ok:true}].concat(
      shuffle(wrong).map(w=>({lb:fmt(w.v,style),ok:false,why:w.why})))),
    ansLabel:fmt(ans,style), ansTyped:typedForm(ans,style),
    work:[
      {t:VA+' = '+fmt(a,style)+',&nbsp; '+VD+' = '+fmt(term(a,d,2),style)+' &minus; '+fmt(a,style)+' = '+fmt(d,style), why:'Pehle '+VA+' aur '+VD+' find karo.'},
      {t:'a<sub>'+n+'</sub> = '+FORMULA.replace(VN,n)+' = '+VA+' + '+(n-1)+VD, why:'Sidhi me '+n+' step hain toh gap '+(n-1)+' hain.'},
      {t:'= '+fmt(a,style)+' + '+(n-1)+'('+fmt(d,style)+') = '+fmt(ans,style), why:'Value daal do, bas.'}
    ],
    say:n+'th term matlab '+(n-1)+' gaps. Ek kam — hamesha.'
  };
}

/* ── 5 · POSITION / NUMBER OF TERMS ────────────────────────── */
function gFindN(lvl){
  const kind = lvl===1 ? pick(['which','count'])
             : lvl===2 ? pick(['which','count','zero'])
             : pick(['which','count','zero','member']);
  let a,d,style='auto',n,val;
  if(lvl===1){ a=F(nz(1,10)); d=F(nz(2,6)); n=rnd(8,25); }
  else if(lvl===2){ a=F(nz(-12,20)); d=F(nz(-8,9)); n=rnd(10,45); }
  else{ a=F(nz(-20,30)); d=F(nz(-11,11)); n=rnd(20,80); }

  if(kind==='zero'){ d=F(nz(-9,-2)); n=rnd(7,22); a=Fneg(Fscale(d,n-1)); val=Fz; }
  else val=term(a,d,n);

  if(kind==='member'){
    /* a value that is NOT a term — "is 168 is AP me aayega?" */
    const near=Fadd(val,F(1));
    if(nOf(a,d,near)===null){
      const list=[
        {lb:'Nahi — ye is AP ka term hai hi nahi', ok:true},
        {lb:'Haan — '+n+'th term', ok:false, why:'Position poori nahi aayi. '+VN+' hamesha whole number hona chahiye.'},
        {lb:'Haan — '+(n+1)+'th term', ok:false, why:'Position poori nahi aayi.'},
        {lb:'Haan — lekin position nahi find kar sakte', ok:false, why:'Find kar sakte hain — aur wo whole number nahi aaya, isliye term hai hi nahi.'}
      ];
      return {
        topic:'findn', kicker:'Term hai ya nahi',
        lead:'Kya '+fmt(near,style)+' is AP ka koi term hai?',
        seq:seqStr(a,d,4,style),
        mode:'mcq', opts:opts4(list), ansLabel:'Nahi — term hai hi nahi',
        work:[
          {t:'Maano a<sub>n</sub> = '+fmt(near,style)+' &rarr; '+fmt(a,style)+' + ('+VN+' &minus; 1)('+fmt(d,style)+') = '+fmt(near,style), why:'Formula lagao aur '+VN+' find karo.'},
          {t:VN+' &minus; 1 = '+fracStr(Fdiv(Fsub(near,a),d)), why:'Poora number nahi aaya.'},
          {t:VN+' whole number nahi &rarr; ye term hai hi nahi', why:'Position aadhi nahi hoti. Koi 7.5th term nahi hota.'}
        ],
        say:VN+' hamesha ginti ka number hai. Fraction aaya matlab wo number series me hai hi nahi.'
      };
    }
    val=term(a,d,n);
  }

  const last=fmt(val,style);
  const isCount = kind==='count';
  const lead = kind==='zero' ? 'Is AP ka kaunsa term zero hai?'
             : isCount       ? 'Is AP me kitne terms hain?'
             :                 'Is AP me '+last+' kaunse number ka term hai?';
  const wrong=[
    {v:n-1, why:'Gaps gin liye, steps nahi. Gaps '+(n-1)+' hain toh terms '+n+'. Plus one karna hai.'},
    {v:n+1, why:'Ek extra step gin liya.'},
    {v:n+2, why:'Do step aage nikal gaye.'},
    {v:n-2, why:'Do step peeche reh gaye.'},
    {v:2*n, why:'Position double kar di.'},
    {v:n+3, why:'Teen step aage nikal gaye.'}
  ].filter(w=>w.v!==n && w.v>0);
  const canT = lvl>=2;
  return {
    topic:'findn', kicker:isCount?'Kitne terms':'Position',
    lead:lead,
    seq:seqStr(a,d,4,style,{dots:true,last:last}),
    mode:canT?'type':'mcq',
    opts:canT?null:opts4([{lb:String(n),ok:true}].concat(
      shuffle(wrong).map(w=>({lb:String(w.v),ok:false,why:w.why})))),
    ansLabel:String(n), ansTyped:String(n),
    work:[
      {t:VA+' = '+fmt(a,style)+',&nbsp; '+VD+' = '+fmt(d,style)+',&nbsp; last term = '+last, why:'Jo diya hai wo pehle likho.'},
      {t:'l = '+FORMULA+' &rarr; '+last+' = '+fmt(a,style)+' + ('+VN+' &minus; 1)('+fmt(d,style)+')', why:'Last term ka formula bhi wahi hai.'},
      {t:VN+' &minus; 1 = '+(n-1)+' &rarr; '+VN+' = '+n, why:'Plus one karna mat bhoolna — sidhi wala plus one.'}
    ],
    say:'Gaps '+(n-1)+', steps '+n+'. Wahi purani sidhi.'
  };
}

/* ── 6 · nth TERM FROM THE END ─────────────────────────────── */
function gFromEnd(lvl){
  const d=F(lvl===1?nz(2,7):nz(-9,9)||3);
  const a=F(nz(1,20));
  const N=rnd(20,60);
  const l=term(a,d,N);
  const k=rnd(4,12);
  const ans=Fsub(l,Fscale(d,k-1));
  const kth=ord(k);
  const wrong=[
    {v:term(a,d,k), why:'Ye shuru se '+kth+' term hai. End se poochha gaya hai.'},
    {v:Fsub(l,Fscale(d,k)), why:'Ek gap zyada le liya. End se '+kth+' me bhi gaps '+(k-1)+' hi hote hain.'},
    {v:Fsub(l,Fscale(d,k-2)), why:'Ek gap kam le liya.'},
    {v:Fadd(l,Fscale(d,k-1)), why:'Plus kar diya. End se aa rahe ho toh subtract karna hai.'},
    {v:l, why:'Ye last term hai — end se pehla. '+kth+' poocha gaya hai.'},
    {v:a, why:'Ye pehla term hai. End se ginna tha.'}
  ].filter(w=>!Feq(w.v,ans));
  const canT=lvl===3&&canType(ans,'auto');
  return {
    topic:'fromend', kicker:'End se',
    lead:'End se '+kth+' term kya hoga?',
    seq:seqStr(a,d,3,'auto',{dots:true,last:fmt(l)}),
    mode:canT?'type':'mcq',

      shuffle(wrong).map(w=>({lb:fmt(w.v),ok:false,why:w.why})))),
    ansLabel:fmt(ans), ansTyped:typedForm(ans),
    work:[
      {t:'End se chalo toh shuruaat l se hoti hai, aur '+VD+' subtract hota jaata hai', why:'Ulti sidhi utar rahe ho.'},
      {t:'End se '+kth+' term = l &minus; ('+k+' &minus; 1)'+VD+' = '+fmt(l)+' &minus; '+(k-1)+'('+fmt(d)+')', why:'Wahi n&minus;1 wala rule, bas ulta.'},
      {t:'= '+fmt(ans), why:''}

/* ── 7 · MIDDLE TERM(S) ────────────────────────────────────── */
function gMid(lvl){
  const wantEven = lvl===3 ? (rng()<0.5) : (lvl===2 ? false : rng()<0.5);
  let N = wantEven ? rnd(8,50)*2 : rnd(8,45)*2+1;
  const d=F(lvl===1?nz(2,6):nz(-9,9)||3);
  const a=F(nz(-10,25));
  const l=term(a,d,N);

  if(lvl===1){
    /* position only — the insight, before the arithmetic */
    const right = wantEven ? (N/2)+'th aur '+(N/2+1)+'th' : ((N+1)/2)+'th';
    const list = wantEven ? [
      {lb:right, ok:true},
      {lb:(N/2)+'th', ok:false, why:'Even number of terms hai — do middle terms aate hain, ek nahi.'},
      {lb:(N/2+1)+'th aur '+(N/2+2)+'th', ok:false, why:'Position ek aage khisak gayi.'},
      {lb:(N/2-1)+'th aur '+(N/2)+'th', ok:false, why:'Ek peeche reh gaye.'},
      {lb:((N+1)/2|0)+'th', ok:false, why:'Even terms hai — do middle terms aate hain.'}
    ] : [
      {lb:right, ok:true},
      {lb:Math.round(N/2)+'th aur '+(Math.round(N/2)+1)+'th', ok:false, why:'Odd number of terms hai — sirf ek middle term aata hai.'},
      {lb:(N/2|0)+'th', ok:false, why:VN+' + 1 karna bhool gaye. ('+N+' + 1) &divide; 2 karo.'},
      {lb:((N+1)/2+1)+'th', ok:false, why:'Ek aage nikal gaye.'},
      {lb:((N+1)/2-1)+'th', ok:false, why:'Ek peeche reh gaye.'}
    ];
    return {
      topic:'mid', kicker:'Middle term',
      lead:'Ek AP me '+N+' terms hain. Middle term kaunsi position par hoga?',
      mode:'mcq', opts:opts4(list), ansLabel:right,
      work:[
        {t:N+' '+(wantEven?'even':'odd')+' hai', why:wantEven?'Even terms &rarr; do middle terms.':'Odd terms &rarr; ek hi middle term.'},
        {t:wantEven?('Pehla = '+VN+'/2 = '+(N/2)+'th,&nbsp; doosra = '+VN+'/2 + 1 = '+(N/2+1)+'th')
                   :('('+VN+' + 1)/2 = ('+N+' + 1)/2 = '+((N+1)/2)+'th'), why:'Bas position hai — value nahi.'}
      ],
      say:wantEven?'Even terms — do beech wale. Odd terms — ek.':'Odd terms — beech me ek hi khada rehta hai.'
    };
  }

  if(!wantEven){
    const pos=(N+1)/2, ans=term(a,d,pos);
    const wrong=[
      {v:term(a,d,N/2|0), why:VN+'/2 le liya. Odd terms me ('+VN+' + 1)/2 lagta hai.'},
      {v:F(pos), why:'Ye position hai, term ki value nahi.'},
      {v:Fadd(a,l), why:'Pehla aur aakhri add kiya — middle aise nahi milta.'},
      {v:term(a,d,pos+1), why:'Ek term aage nikal gaye.'},
      {v:term(a,d,pos-1), why:'Ek term peeche reh gaye.'},
      {v:l, why:'Ye last term hai, middle nahi.'},
      {v:a, why:'Ye pehla term hai, middle nahi.'}
    ].filter(w=>!Feq(w.v,ans));
    const canT=lvl===3&&canType(ans,'auto');
    return {
      topic:'mid', kicker:'Middle term',
      lead:'Is AP ka middle term kya hai?',
      seq:seqStr(a,d,3,'auto',{dots:true,last:fmt(l)}),
      mode:canT?'type':'mcq',
      opts:canT?null:opts4([{lb:fmt(ans),ok:true}].concat(
        shuffle(wrong).map(w=>({lb:fmt(w.v),ok:false,why:w.why})))),
      ansLabel:fmt(ans), ansTyped:typedForm(ans),
      work:[
        {t:'Pehle '+VN+': l = '+FORMULA+' &rarr; '+fmt(l)+' = '+fmt(a)+' + ('+VN+' &minus; 1)('+fmt(d)+') &rarr; '+VN+' = '+N,
         why:'Middle find karne se pehle total terms find karna padta hai.'},
        {t:N+' odd hai &rarr; ek middle term, position ('+N+' + 1)/2 = '+pos, why:'Odd &rarr; ek.'},
        {t:'a<sub>'+pos+'</sub> = '+fmt(a)+' + '+(pos-1)+'('+fmt(d)+') = '+fmt(ans), why:'Ab wahi purana formula.'}
      ],
      say:'Middle term ka question 3 marks ka hai, aur board me aata hi hai.'
    };
  }

  const p1=N/2, p2=N/2+1, t1=term(a,d,p1), t2=term(a,d,p2);
  const right=fmt(t1)+' aur '+fmt(t2);
  const list=[
    {lb:right, ok:true},
    {lb:fmt(term(a,d,p1-1))+' aur '+fmt(t1), ok:false, why:'Ek position peeche reh gaye.'},
    {lb:fmt(t2)+' aur '+fmt(term(a,d,p2+1)), ok:false, why:'Ek position aage nikal gaye.'},
    {lb:p1+' aur '+p2, ok:false, why:'Ye positions hain, values nahi. '+p1+'th aur '+p2+'th term ki value find karni thi.'},
    {lb:fmt(a)+' aur '+fmt(l), ok:false, why:'Ye pehla aur aakhri term hain. Beech wale chahiye the.'},
    {lb:fmt(term(a,d,p1-1))+' aur '+fmt(term(a,d,p2+1)), ok:false, why:'Dono taraf ek-ek term door nikal gaye.'}
  ];
  return {
    topic:'mid', kicker:'Middle terms',
    lead:'Is AP ke middle terms kya hain?',
    seq:seqStr(a,d,3,'auto',{dots:true,last:fmt(l)}),
    mode:'mcq', opts:opts4(list), ansLabel:right, seqOpts:true,
    work:[
      {t:'Pehle '+VN+': '+fmt(l)+' = '+fmt(a)+' + ('+VN+' &minus; 1)('+fmt(d)+') &rarr; '+VN+' = '+N, why:'Total terms.'},
      {t:N+' even hai &rarr; do middle terms: '+VN+'/2 = '+p1+'th aur '+VN+'/2 + 1 = '+p2+'th', why:'Even &rarr; do.'},
      {t:'a<sub>'+p1+'</sub> = '+fmt(a)+' + '+(p1-1)+'('+fmt(d)+') = '+fmt(t1), why:''},
      {t:'a<sub>'+p2+'</sub> = '+fmt(a)+' + '+(p2-1)+'('+fmt(d)+') = '+fmt(t2), why:'Doosra hamesha pehle se ek aage hi hota hai.'}
    ],
    say:'Even terms — do beech wale, aur doosra hamesha pehle wale ke bilkul baad.'
  };
}

            {t:'a<sub>'+p+'</sub> = '+VA+' + '+(p-1)+VD, why:'Formula.'},
            {t:'aur wo '+v+' hai &rarr; '+right, why:'"is" ka matlab equal to.'}],

    return {topic:'symb',kicker:'Formula',lead:'Kisi AP ka pth term kya hoga?',
      mode:'mcq',opts:opts4(list),ansLabel:'a + (p − 1)d',
      work:[{t:'a<sub>n</sub> = '+FORMULA, why:'n ki jagah jo bhi ho, wahi rakh do.'},
            {t:'a<sub>p</sub> = '+VA+' + (p &minus; 1)'+VD, why:'Bas n hata ke p likh diya.'}],
      say:'n ho ya p ho ya r — formula wahi rehta hai.'};
  }
  if(kind==='last'){
    const list=[
      {lb:'l = '+FORMULA, ok:true},
      {lb:'l = '+VA+' + '+VN+VD, ok:false, why:'Last term ka bhi wahi formula hai — '+VN+' &minus; 1.'},
      {lb:'l = '+VN+'/2 ['+'2'+VA+' + ('+VN+' &minus; 1)'+VD+']', ok:false, why:'Ye sum ka formula hai, last term ka nahi.'},
      {lb:'l = '+VA+' + '+VN+' + '+VD, ok:false, why:VD+' ko '+VN+' &minus; 1 se multiply karna hota hai.'}

    ()=>{ const k=pick([4,3,5]);
      return {txt:'Ek cylinder me bhari hui hawa me se vacuum pump har baar bachi hui hawa ka 1/'+k+' hissa nikal deta hai. Har baar bachi hui hawa.',
        seq:['1', fracStr(F(k-1,k)), fracStr(F((k-1)*(k-1),k*k)), fracStr(F(Math.pow(k-1,3),Math.pow(k,3)))],
        yes:false, why:'Nahi — har baar multiply ho raha hai, add nahi',

    ()=>{ const s=pick([1,2,3]);
      return {txt:'Ek square ka side har baar 1 cm badhta hai, side '+s+' cm se shuru. Har square ka area.',

        why:'Nahi — gap khud badhta ja raha hai', d:String((s+1)*(s+1)-s*s),

      {t:c.yes?('Barabar &rarr; yes, this forms an AP with common difference '+c.d)

    say:c.yes?'Exam me reason bhi likhna — "because we have a common difference".'
             :'Exam me poora likhna: "this does not form an AP because we do not have a common difference".'
  };
}

  }
  if(kind==='product'){
    const p=pick([3,2,4]), q=p+2, v=pick([1,4,9]);
    const right='('+VA+' + '+(p-1)+VD+')('+VA+' + '+(q-1)+VD+') = '+v;
    return {topic:'translate',kicker:'English se equation',
      lead:'"The product of the '+ord(p)+' and '+ord(q)+' terms of an AP is '+v+'." Ise equation me likho.',
      mode:'mcq',ansLabel:right,
      opts:opts4([
        {lb:right,ok:true},
        {lb:'('+VA+' + '+(p-1)+VD+') + ('+VA+' + '+(q-1)+VD+') = '+v,ok:false,why:'Product bola hai — multiply, plus nahi.'},
        {lb:'('+VA+' + '+p+VD+')('+VA+' + '+q+VD+') = '+v,ok:false,why:'Ek-ek gap zyada.'},
        {lb:p+VA+' &times; '+q+VD+' = '+v,ok:false,why:VA+' ko position se multiply nahi karte.'}
      ]),
      work:[{t:'Product matlab multiply', why:'Sum matlab plus, product matlab into.'},
            {t:right, why:'Dono terms ko bracket me likhna mat bhoolna.'}],
      say:'Sum = plus. Product = into. Chhoti baat hai, marks yahin jaate hain.'};
  }
  if(kind==='twice'){
    const p=pick([7,9,11]), q=pick([3,4,5]);
    const right=VA+' + '+(p-1)+VD+' = 2('+VA+' + '+(q-1)+VD+')';
    return {topic:'translate',kicker:'English se equation',
      lead:'"The '+ord(p)+' term of an AP is twice its '+ord(q)+' term." Ise equation me likho.',
      mode:'mcq',ansLabel:right,
      opts:opts4([
        {lb:right,ok:true},
        {lb:'2('+VA+' + '+(p-1)+VD+') = '+VA+' + '+(q-1)+VD,ok:false,why:'Twice kis par lag raha hai dekho — '+ord(q)+' term par.'},
        {lb:VA+' + '+p+VD+' = 2('+VA+' + '+q+VD+')',ok:false,why:'Dono jagah ek gap zyada.'},
        {lb:VA+' + '+(p-1)+VD+' = '+VA+' + 2('+(q-1)+')'+VD,ok:false,why:'Poore term ka double hona hai, sirf '+VD+' ka nahi.'}
      ]),
      work:[{t:ord(p)+' term = '+VA+' + '+(p-1)+VD, why:''},
            {t:ord(q)+' term = '+VA+' + '+(q-1)+VD, why:''},
            {t:'"is twice its '+ord(q)+' term" &rarr; '+right, why:'Twice matlab 2 se multiply — aur poore bracket par.'}],
      say:'Bracket lagana mat bhoolna. Twice poore term ka hota hai.'};
  }
  const n=pick([99,50,75]);
  const right='('+VA+' + '+(n-1)+VD+') &minus; (A + '+(n-1)+VD+') = '+n;
  return {topic:'translate',kicker:'English se equation',
    lead:'Do APs ka common difference same hai. "The difference of their '+ord(n)+' terms is '+n+'." Ise likho — pehle ka first term '+VA+', doosre ka A.',
    mode:'mcq',ansLabel:right,
    opts:opts4([
      {lb:right,ok:true},
      {lb:'('+VA+' + '+n+VD+') &minus; (A + '+n+VD+') = '+n,ok:false,why:'Ek gap zyada.'},
      {lb:VA+' + '+(n-1)+VD+' &minus; A + '+(n-1)+VD+' = '+n,ok:false,why:'Bracket nahi lagaya — minus andar jaake sign badalta hai.'},
      {lb:'('+VA+' &minus; A)('+n+' &minus; 1)'+VD+' = '+n,ok:false,why:'Difference hai, product nahi.'}
    ]),
    work:[{t:'Pehle AP ka '+ord(n)+' term = '+VA+' + '+(n-1)+VD, why:''},
          {t:'Doosre AP ka '+ord(n)+' term = A + '+(n-1)+VD, why:VD+' dono ka same hai, isliye same '+VD+'.'},
          {t:right+' &rarr; '+VA+' &minus; A = '+n, why:(n-1)+VD+' cancel ho gaya. Isiliye har position par difference wahi rahega.'}],
    say:'Term ek poori cheez hai — usko hamesha bracket me rakho.'};
}

/* ── 11 · FULL WORD PROBLEMS ───────────────────────────────── */
function gApply(lvl){
  const R='&#8377;';
  const kind=pick(lvl===1?['taxi','seats']:lvl===2?['rows','salary','taxi','seats']:['rows','salary','savings','taxi']);

    const n=rnd(8,18), d=-pick([2,3,4]), last=pick([3,5,7,4]);
    const a=last-d*(n-1);
    const seq=[a,a+d,a+2*d].map(x=>fmt(F(x))).join(', ')+', '+DOTS+', '+last;
    return {topic:'apply',kicker:'Word problem',
      lead:'Ek phoolon ki kyari me sabse upar wali row me '+a+' paudhe hain, agli me '+(a+d)+', usse agli me '+(a+2*d)+', aur aise hi. Sabse aakhri row me '+last+' paudhe hain. Kyari me kitni rows hain?',
      seq:seq, seqSmall:true,
      mode:lvl===1?'mcq':'type', ansLabel:String(n), ansTyped:String(n),
      opts:lvl===1?opts4([{lb:String(n),ok:true},
        {lb:String(n-1),ok:false,why:'Gaps gin liye, rows nahi. Plus one karo.'},
        {lb:String(n+1),ok:false,why:'Ek row zyada gin li.'},
        {lb:String(last),ok:false,why:'Ye aakhri row ke paudhe hain, rows ki ginti nahi.'},
        {lb:String(n+2),ok:false,why:'Do row zyada gin li.'},
        {lb:String(a),ok:false,why:'Ye pehli row ke paudhe hain, rows ki ginti nahi.'}]):null,
      work:[
        {t:'Given AP: '+seq, why:'Sabse pehle situation ko AP me likho.'},
        {t:VA+' = '+a+',&nbsp; '+VD+' = '+(a+d)+' &minus; '+a+' = '+fmt(F(d))+',&nbsp; l = '+last, why:'Rows kam ho rahi hain, isliye '+VD+' minus me hai.'},
        {t:'l = '+FORMULA+' &rarr; '+last+' = '+a+' + ('+VN+' &minus; 1)('+fmt(F(d))+')', why:'Rows hi terms hain.'},
        {t:VN+' = '+n, why:'Toh kyari me '+n+' rows hain.'}

      lead:'Subba Rao ne '+y0+' me '+R+s+' annual salary par kaam shuru kiya, aur har saal '+R+i+' ka increment milta hai. Kis saal me unki salary '+R+t+' ho jayegi?',
      seq:[s,s+i,s+2*i].map(String).join(', ')+', '+DOTS+', '+t, seqSmall:true,
      mode:'type', ansLabel:String(y0+n-1), ansTyped:String(y0+n-1),
      work:[
        {t:'Salary har saal: '+s+', '+(s+i)+', '+(s+2*i)+', '+DOTS, why:'Pehle saal increment nahi milta — wahi '+VA+' hai.'},
        {t:VA+' = '+s+',&nbsp; '+VD+' = '+i+',&nbsp; a<sub>n</sub> = '+t, why:'Saal hi terms hain.'},
        {t:t+' = '+s+' + ('+VN+' &minus; 1)('+i+') &rarr; '+VN+' = '+n, why:'Toh '+n+'th saal me.'},
        {t:y0+' pehla saal hai &rarr; '+n+'th saal = '+y0+' + '+(n-1)+' = '+(y0+n-1), why:'Yahan bhi ek kam. '+y0+' khud pehla saal hai.'}
      ],
      say:'Pehla saal '+y0+' hai, isliye '+n+'th saal '+(y0+n)+' nahi — '+(y0+n-1)+'. Wahi n − 1.'};
  }

  if(kind==='savings'){
    const a=F(pick([500,400,600]),100), d=F(pick([175,125,150,225]),100);
    const n=rnd(7,14);

    return {topic:'apply',kicker:'Word problem',
      lead:'Ramkali ne pehle hafte '+R+moneyStr(a)+' bachaye, aur uske baad har hafte '+R+moneyStr(d)+' zyada bachati gayi. Kis hafte me uski weekly saving '+R+moneyStr(t)+' ho jayegi?',
      seq:[1,2,3].map(i=>moneyStr(term(a,d,i))).join(', ')+', '+DOTS+', '+moneyStr(t), seqSmall:true,
      mode:'type', ansLabel:String(n), ansTyped:String(n),
      work:[
        {t:'Given AP: '+[1,2,3].map(i=>moneyStr(term(a,d,i))).join(', ')+', '+DOTS+', '+moneyStr(t), why:'Hafte hi terms hain.'},
        {t:VA+' = '+moneyStr(a)+',&nbsp; '+VD+' = '+moneyStr(d)+',&nbsp; l = '+moneyStr(t), why:'Paise ki tarah dekho — kaam aasan ho jata hai.'},
        {t:moneyStr(t)+' = '+moneyStr(a)+' + ('+VN+' &minus; 1)('+moneyStr(d)+')', why:'Wahi last term ka formula.'},
        {t:moneyStr(Fsub(t,a))+' = ('+VN+' &minus; 1)('+moneyStr(d)+') &rarr; '+VN+' &minus; 1 = '+(n-1)+' &rarr; '+VN+' = '+n, why:'Decimal se mat darna — rupaye aur paise samajh lo.'}
      ],
      say:'Decimal aaye toh paise ki tarah dekho. Rupaye alag, paise alag.'};
  }

  if(kind==='seats'){
    const f=pick([20,23,18,25]), k=pick([2,3,4]), r=rnd(6,20);
    const ans=f+k*(r-1);
    return {topic:'apply',kicker:'Word problem',
      lead:'Ek hall ki pehli row me '+f+' seats hain, aur har agli row me '+k+' seats zyada. '+ord(r)+' row me kitni seats hongi?',
      seq:[f,f+k,f+2*k].map(String).join(', ')+', '+DOTS, seqSmall:true,
      mode:lvl===1?'mcq':'type', ansLabel:String(ans), ansTyped:String(ans),
      opts:lvl===1?opts4([{lb:String(ans),ok:true},
        {lb:String(f+k*r),ok:false,why:ord(r)+' row me gaps '+(r-1)+' hote hain, '+r+' nahi.'},
        {lb:String(f+k*(r-2)),ok:false,why:'Ek gap kam.'},

        {lb:String(f+k*(r+1)),ok:false,why:'Ek row aage nikal gaye.'},
        {lb:String(f*r),ok:false,why:'Pehli row ko row number se multiply kar diya.'}]):null,
      work:[
        {t:VA+' = '+f+',&nbsp; '+VD+' = '+k, why:'Pehli row hi pehla term hai.'},
        {t:'a<sub>'+r+'</sub> = '+f+' + ('+r+' &minus; 1)('+k+') = '+f+' + '+(k*(r-1)), why:r+' rows me gaps '+(r-1)+'.'},
        {t:'= '+ans+' seats', why:''}
      ],
      say:'Row number hi n hai. Pehli row me koi gap nahi hota.'};
  }

  const ans=f+e*(k-1);
  return {topic:'apply',kicker:'Word problem',
    lead:'Taxi ka kiraya pehle kilometre ka '+R+f+' hai, aur uske baad har kilometre ka '+R+e+'. '+k+' km ka kiraya kitna hoga?',
    seq:[f,f+e,f+2*e].map(String).join(', ')+', '+DOTS, seqSmall:true,
    mode:lvl===1?'mcq':'type', ansLabel:String(ans), ansTyped:String(ans),
    opts:lvl===1?opts4([{lb:String(ans),ok:true},
      {lb:String(f+e*k),ok:false,why:'Pehla km '+R+f+' me hi aa gaya. Uske baad sirf '+(k-1)+' km ka extra lagta hai.'},
      {lb:String(e*k),ok:false,why:'Pehle km ka '+R+f+' add karna bhool gaye.'},
      {lb:String(f+e*(k-2)),ok:false,why:'Ek km kam gin liya.'},
      {lb:String(f*k),ok:false,why:'Pehle km ke rate ko km se multiply kar diya.'},
      {lb:String(f+e),ok:false,why:'Sirf ek extra km ka add kiya.'}]):null,
    work:[
      {t:'1 km &rarr; '+R+f+',&nbsp; 2 km &rarr; '+R+(f+e)+',&nbsp; 3 km &rarr; '+R+(f+2*e), why:'Pehle chhote numbers pe dekho.'},
      {t:VA+' = '+f+',&nbsp; '+VD+' = '+e, why:'Pehla km hi pehla term.'},
      {t:'a<sub>'+k+'</sub> = '+f+' + ('+k+' &minus; 1)('+e+') = '+R+ans, why:''}
    ],
    say:'Pehla km alag rate pe hai — wahi '+VA+' hai. Baaki har km '+VD+'.'};
}

/* ── 12 · TWO EQUATIONS (NCERT 5.2 Q18 shape) ──────────────── */
function gTwoEq(lvl){
  const a=nz(-15,12), d=nz(2,7);
  const p=pick([3,4,5]), q=p+4, r=p+2, s=q+2;
  const S1=(a+(p-1)*d)+(a+(q-1)*d);
  const S2=(a+(r-1)*d)+(a+(s-1)*d);
  const t3=[a,a+d,a+2*d].map(x=>fmt(F(x))).join(', ');
  const s1=fmt(F(S1)), s2=fmt(F(S2)), h1=fmt(F(S1/2)), h2=fmt(F(S2/2)), dv=fmt(F(d)), av=fmt(F(a));
  const list=[
    {lb:t3, ok:true},
    {lb:[a,a-d,a-2*d].map(x=>fmt(F(x))).join(', '), ok:false, why:VD+' ka sign ulta lag gaya.'},
    {lb:[a+d,a+2*d,a+3*d].map(x=>fmt(F(x))).join(', '), ok:false, why:'Pehla term chhod diya — ye doosre se shuru ho raha hai.'},
    {lb:[d,a,a+d].map(x=>fmt(F(x))).join(', '), ok:false, why:VA+' aur '+VD+' aapas me badal gaye.'}
  ];
  const lead='Ek AP ke '+ord(p)+' aur '+ord(q)+' term ka sum '+s1+' hai, aur '+ord(r)+' aur '+ord(s)+' term ka sum '+s2+' hai. Pehle teen terms kya honge?';
  return {
    topic:'twoeq', kicker:'Do equations',
    lead:lead,
    mode:'mcq', opts:opts4(list), ansLabel:t3, seqOpts:true,
    work:[
      {t:'('+VA+' + '+(p-1)+VD+') + ('+VA+' + '+(q-1)+VD+') = '+s1+' &rarr; 2'+VA+' + '+(p+q-2)+VD+' = '+s1,
       why:'Pehli baat ko equation banao.'},
      {t:VA+' + '+((p+q-2)/2)+VD+' = '+h1+'&nbsp; &nbsp;(i)', why:'2 common tha — simplest form me le aao.'},
      {t:'('+VA+' + '+(r-1)+VD+') + ('+VA+' + '+(s-1)+VD+') = '+s2+' &rarr; '+VA+' + '+((r+s-2)/2)+VD+' = '+h2+'&nbsp; &nbsp;(ii)',
       why:'Doosri baat se doosri equation.'},
      {t:'(ii) &minus; (i): '+(((r+s-2)/2)-((p+q-2)/2))+VD+' = '+fmt(F((S2-S1)/2))+' &rarr; '+VD+' = '+dv,
       why:'Ab ye seedha linear equations wala kaam hai — elimination ya substitution.'},
      {t:VD+' ko (i) me daalo &rarr; '+VA+' = '+av, why:''},
      {t:'Pehle teen terms: '+t3, why:'a, a + d, a + 2d.'}
    ],
    say:'Do baatein di hain toh do equations banenge. Yahan se aage wahi linear equation wala chapter hai.'
  };
}
